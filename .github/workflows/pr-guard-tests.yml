name: PR bot tests

# Tests for the pull request bot (.github/scripts/pr-guard.js), including a scan of the real codebase
# to make sure the risky-code tripwire raises no false alarms.
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/pr-guard*.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/pr-guard*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: node --test .github/scripts/pr-guard.test.js
