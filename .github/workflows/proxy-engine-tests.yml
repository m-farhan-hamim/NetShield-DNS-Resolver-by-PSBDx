name: Proxy engine tests

# Runs the proxy engine against a real Linux TCP stack (a TUN device), not just a unit test.
on:
  pull_request:
    paths:
      - 'app/src/main/java/com/example/proxy/core/**'
      - 'app/src/main/java/com/example/dns/IpPacketUtils.java'
      - 'tools/proxy-interop/**'
      - '.github/workflows/proxy-engine-tests.yml'
  push:
    branches: ['feat/proxy-mode']
    paths:
      - 'app/src/main/java/com/example/proxy/core/**'
      - 'app/src/main/java/com/example/dns/IpPacketUtils.java'
      - 'tools/proxy-interop/**'
      - '.github/workflows/proxy-engine-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    name: Linux TUN interop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile the core and run the TUN interop test
        run: bash tools/proxy-interop/run-interop.sh
