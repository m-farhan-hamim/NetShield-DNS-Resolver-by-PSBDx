name: Restore Keystore

on: [workflow_dispatch]

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Decode Keystore from Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > recovered-keystore.jks
          
      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovered-jks
          path: recovered-keystore.jks
