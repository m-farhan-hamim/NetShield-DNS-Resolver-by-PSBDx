name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least-privilege default for every job; the release job below opts in to
# contents: write itself because it publishes the GitHub Release.
permissions:
  contents: read

jobs:
  debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          # Ensure debug.keystore exists for signing the debug APK
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keypass android -storepass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure Gradle wrapper exists and has executable permissions
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    # Secrets aren't available to pull_request builds from forks, so the
    # signed release build only runs for pushes/manual runs/tags in this repo.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: debug
    permissions:
      contents: write

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
      RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '9.3.1'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set - skipping signed release build." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Signed Release APK & Bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$KEYSTORE_PATH"

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      # Only for actual version tags (e.g. "v1.2.0") - this is what the
      # in-app update checker (UpdateChecker) queries via the GitHub
      # Releases API, so the attached APK's name must end in ".apk".
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
