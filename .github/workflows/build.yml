name: Build Signed Production APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Unsigned Release APK and AAB
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease bundleRelease
          else
            gradle assembleRelease bundleRelease
          fi

      - name: Sign Production APK
        uses: filippoLeporati93/android-release-signer@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.RELEASE_KEYALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Sign Production AAB
        uses: filippoLeporati93/android-release-signer@v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.RELEASE_KEYALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-production-apk
          path: app/build/outputs/apk/release/*-signed.apk

      - name: Upload Production AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-production-aab
          path: app/build/outputs/bundle/release/*-signed.aab
