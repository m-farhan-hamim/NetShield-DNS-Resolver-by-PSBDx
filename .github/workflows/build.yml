name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least-privilege default for every job; the release job below opts in to
# contents: write itself because it publishes the GitHub Release.
permissions:
  contents: read

jobs:
  debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          # Ensure debug.keystore exists for signing the debug APK
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keypass android -storepass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure Gradle wrapper exists and has executable permissions
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    # Reports problems without blocking a merge. Findings are listed in the job summary.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Gradle wrapper and debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keypass android -storepass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Run Android Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --continue --stacktrace

      - name: Summarize lint findings
        if: always()
        run: |
          python3 - <<'EOF'
          import os, glob
          import xml.etree.ElementTree as ET
          files = glob.glob('app/build/reports/lint-results-debug.xml')
          out = []
          if not files:
              out.append('No lint report was produced.')
          else:
              root = ET.parse(files[0]).getroot()
              rank = {'Fatal': 0, 'Error': 1, 'Warning': 2, 'Informational': 3}
              issues = sorted(root.findall('issue'), key=lambda i: (rank.get(i.get('severity'), 9), i.get('id')))
              out.append('Lint: %d issues' % len(issues))
              for i in issues:
                  loc = i.find('location')
                  where = ''
                  if loc is not None:
                      where = '%s:%s' % (loc.get('file', '').split('app/src/', 1)[-1], loc.get('line', ''))
                  out.append('%s | %s | %s | %s' % (i.get('severity'), i.get('id'), where, (i.get('message') or '').replace('\n', ' ')))
          text = '\n'.join(out)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```\n' + text[:60000] + '\n```\n')
          EOF

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14

  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    # Secrets aren't available to pull_request builds from forks, so the
    # signed release build only runs for pushes/manual runs/tags in this repo.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: debug
    permissions:
      contents: write

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
      RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: '9.3.1'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set - skipping signed release build." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Signed Release APK & Bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$KEYSTORE_PATH"

      - name: Upload Release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      # Only for actual version tags (e.g. "v1.2.0") - this is what the
      # in-app update checker (UpdateChecker) queries via the GitHub
      # Releases API, so the attached APK's name must end in ".apk".
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
