name: Build Signed Production APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Unsigned Release APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign Production APK
        uses: rslocate/android-release-signer@v1.3.1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.RELEASE_KEYALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Sign Production AAB
        uses: rslocate/android-release-signer@v1.3.1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.RELEASE_KEYALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-production-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Production AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-production-aab
          path: app/build/outputs/bundle/release/*.aab
