            // ==========================================
            // 💬 VERSION CONVERSATION
            // ==========================================
            function parseVersionReply(text) {
              const m = (text || "").slice(0, 500).match(/\b(?:(alpha|beta|nightly)[\s_:-]*)?v?(\d{1,3})\.(\d{1,3})\.(\d{1,3})\b/i);
              if (!m) return null;
              return { channel: m[1] ? m[1].toLowerCase() : null, nums: [+m[2], +m[3], +m[4]], ver: `${m[2]}.${m[3]}.${m[4]}` };
            }

            function resolveChannel(p) {
              if (selectedChannel === "other") return p.channel || "prerelease";
              if (p.channel && p.channel !== selectedChannel) return null;
              return selectedChannel;
            }

            const logVersion = (body.match(/NetShield\s+v?(\d+\.\d+\.\d+)/i) || [])[1];
            const logHint = logVersion ? `Your diagnostic log mentions \`${logVersion}\`, which is usually the installed version.` : "";

            const HINT = {
              stable: "Just the number is fine, e.g. `3.1.1`.",
              beta: "Since you picked **Beta Build**, something like `BETA-3.1.1` works.",
              alpha: "Since you picked **Alpha Build**, something like `ALPHA-3.1.1` works.",
              nightly: "Since you picked **Nightly Build**, something like `NIGHTLY-3.1.1` works.",
              other: "The release number from GitHub is fine, e.g. `3.2.0`.",
            };

            const ASK = [
              ({ u, hint }) => `Hey @${u}, thanks for taking the time to report this! 🙏 One quick thing before I pass it along: which version of NetShield are you running? ${hint}`,
              ({ u, hint }) => `Hi @${u}! Got your report — thanks! Could you tell me which version of the app you're on? ${hint} Just reply right here.`,
              ({ u, hint }) => `Thanks for the report, @${u}! There's just one thing I'm missing: your app version. ${hint}`,
              ({ u, hint }) => `Hello @${u} 👋 Appreciate you filing this. Which version of NetShield is installed on your phone? ${hint}`,
              ({ u, hint }) => `Hey @${u}, before the developer takes a look I need to know which version you're on. ${hint} A quick reply is all it takes!`,
              ({ u, hint }) => `Nice, thanks @${u}. Last piece of the puzzle: which app version are you using? ${hint} Just reply in this thread.`,
              ({ u, hint }) => `Hi @${u}, thanks for the detailed report! Mind telling me which version of the app this happened on? ${hint}`,
              ({ u, hint }) => `Hey @${u}, got it, thanks! Which version is this happening on? ${hint}`,
              ({ u, hint }) => `Thanks a lot for the info, @${u}! 🙌 One tiny gap: which NetShield version are you on? ${hint}`,
              ({ u, hint }) => `👋 Hi @${u}, we received your report! Could you confirm the app version? ${hint}`,
              ({ u, hint }) => `@${u} thanks for filing this! Which version of the app are you using right now? ${hint}`,
              ({ u, hint }) => `Appreciate the report, @${u}! Before I forward this to the developer, could you share your NetShield version? ${hint}`,
            ];
            const NUDGE = [
              ({ u }) => `Hmm, I couldn't spot a version number in that, @${u}. 🤔 Could you send it like \`3.1.1\`? ${logHint}`,
              () => `Thanks for replying! I'm still missing the version though. Something like \`3.1.1\` would do it. ${logHint}`,
              ({ u }) => `Almost there, @${u}! I just need the version number (three numbers, like \`3.1.1\`). ${logHint}`,
              () => `Sorry, I didn't catch a version in that. Mind sending it as \`x.y.z\`, e.g. \`3.1.1\`? ${logHint}`,
              ({ u }) => `No worries if it's hard to find, @${u}. ${logHint} Once you have it, just reply with the number (e.g. \`3.1.1\`).`,
              ({ u }) => `Thanks @${u}! The version is still missing — could you paste it exactly as shown, like \`3.1.1\`? ${logHint}`,
              ({ u }) => `Almost there, @${u} — I just need the version number. Format \`X.Y.Z\` please (e.g. \`3.1.1\`). ${logHint}`,
              () => `I couldn't find a version in that reply. Could you send something like \`3.1.1\`? ${logHint}`,
            ];
            const MISMATCH = [
              ({ u, type, said }) => `Hmm, @${u}, you picked **${type}** in the form, but \`${said}\` looks like a different kind of build. 🤔 Could you double-check and send the version again? If the Version Type in the form was wrong, you can also just edit the issue and change it.`,
              ({ u, type, said }) => `Quick sanity check, @${u}: the form says **${type}**, but \`${said}\` doesn't look like that kind of build. Which one is right? Reply with the correct version, or edit the Version Type in the issue if that's what was off.`,
              ({ u, type, said }) => `Thanks! One thing doesn't add up though: you chose **${type}** but \`${said}\` is from a different channel. Mind confirming the version again, @${u}? (Or fix the Version Type by editing the issue.)`,
              ({ u, type, said }) => `Hey @${u}, I think something got mixed up: **${type}** and \`${said}\` don't match. Could you send the right version? You can also edit the issue to change the Version Type.`,
              ({ u, type, said }) => `Hold on, @${u} — the form says **${type}** but \`${said}\` sounds like a different channel. Which is correct? Feel free to edit the issue if the Version Type was wrong.`,
            ];
            const ACK = [
              ({ u, v }) => `Perfect, thanks @${u}! 🙌 Noted **${v}**. I've passed this to the developer and they'll take a look as soon as they're free.`,
              ({ v }) => `Got it, **${v}**. Thanks for confirming! The developer has been notified and will look into it when they get a chance.`,
              ({ u, v }) => `Thanks @${u}, that's everything I needed. 👍 Marked as **${v}** and handed over to the developer.`,
              ({ v }) => `Awesome, thank you! **${v}** noted. This is now in the developer's queue.`,
              ({ v }) => `Great, that helps a lot. Logged **${v}** and sent it over to the developer. 🚀`,
              ({ u, v }) => `Thanks for the quick reply, @${u}! Version **${v}** is on record and the developer will pick this up soon.`,
              ({ u, v }) => `All set, @${u} — **${v}** noted. 🙏 The developer has been looped in.`,
              ({ u, v }) => `Perfect, @${u}! Logged **${v}**. You'll hear from us here when the developer gets to it. 🛠️`,
              ({ v }) => `Thanks! **${v}** is now recorded and the issue is with the developer. Appreciate the quick reply! 🙌`,
              ({ u, v }) => `Great, thanks @${u}. Marked **${v}** and moved this to the developer's queue. 🚀`,
            ];
            const LEGACY = [
              ({ u, v }) => `Thanks for letting me know, @${u}. 🙏 **${v}** is an older release that's no longer supported, so I can't take bug reports for it. Please update to the **latest stable release** from GitHub Releases, F-Droid, or APK Pure, and open a new issue if the problem is still there.`,
              ({ u, v }) => `Thanks, @${u}! Unfortunately **${v}** is past its support window. Could you update to the **latest stable release** (GitHub Releases, F-Droid, or APK Pure) and check if it still happens? If it does, please open a fresh issue.`,
              ({ u, v }) => `Appreciate the quick reply, @${u}. 📦 That version (**${v}**) has reached end of support, so I'll close this one. Updating to the **latest stable release** often fixes things, and a new issue is welcome if it doesn't.`,
              ({ u, v }) => `Thanks for confirming, @${u}. **${v}** is no longer supported — could you update to the latest stable build (GitHub Releases / F-Droid / APK Pure) and re-check? If the issue persists, just open a new issue. 🙏`,
            ];

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            const trigger = isComment ? context.payload.comment : null;
            const thread = trigger && !comments.some((c) => c.id === trigger.id) ? [...comments, trigger] : comments;

            const askComment = thread.find((c) => c.user?.type === "Bot" && c.body?.includes(MARK("ask-version")));
            let accepted = null;
            let lastMismatch = null;
            if (askComment) {
              const replies = thread.filter((c) => c.user?.login === REPORTER && c.id > askComment.id);
              for (const r of replies) {
                const p = parseVersionReply(r.body);
                if (!p) continue;
                const channel = resolveChannel(p);
                if (channel) { accepted = { ...p, channel }; break; }
                lastMismatch = { p, id: r.id };
              }
            }

            if (!accepted) {
              await setStatus("on-hold");
              const ctx = { u: REPORTER, type: safe(versionType), hint: HINT[selectedChannel] };

              if (!askComment) {
                await sayOnce("ask-version", pick(ASK)(ctx).trim());
                return;
              }
              if (isComment) {
                if (lastMismatch && lastMismatch.id === trigger.id) {
                  const said = `${lastMismatch.p.channel ? lastMismatch.p.channel.toUpperCase() + "-" : ""}${lastMismatch.p.ver}`;
                  await sayOnce(`mismatch-${trigger.id}`, pick(MISMATCH)({ ...ctx, said }).trim());
                } else if (!parseVersionReply(trigger.body)) {
                  const nudges = comments.filter((c) => c.user?.type === "Bot" && c.body?.includes("<!-- netshield-bot:nudge-")).length;
                  if (nudges < 3) await sayOnce(`nudge-${trigger.id}`, pick(NUDGE)(ctx).trim());
                }
              }
              return;
            }

            const isTestBuild = ["alpha", "beta", "nightly"].includes(accepted.channel);
            const shown = isTestBuild ? `${accepted.channel.toUpperCase()}-${accepted.ver}` : accepted.ver;
            const versionTag = accepted.channel === "stable" ? `v${accepted.ver}` : isTestBuild ? shown : `PRE-${accepted.ver}`;

            const cmp = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            if (cmp(accepted.nums, MIN_SUPPORTED) < 0) {
              await closeWith("legacy", pick(LEGACY)({ u: REPORTER, v: shown }));
              return;
            }

            await setStatus("handed-over-to-developer");

            try {
              await trackVersion(accepted.ver, versionTag);
            } catch (e) {
              core.warning(`Version tracking failed: ${e.message}`);
            }

            await sayOnce("ack",
              pick(ACK)({ u: REPORTER, v: shown }) +
              (accepted.channel === "stable" ? "" : `\n\nThanks for testing our preview builds, it really helps! 🧪`));

            // ==========================================
            // 💡 SMART FAQ
            // ==========================================
            const text = `${issue.title}\n${body}`.toLowerCase();

            const FAQ = [
              {
                id: "battery",
                match: /\b(battery|drain(ing|s|ed)?|power usage|wakelock)\b/,
                tips: [
                  `🔋 **Regarding Battery Usage:**\nAndroid attributes all routed traffic to NetShield because it runs as a local \`VpnService\`, so the battery stats menu counts bandwidth passing through the local DNS proxy as CPU use. Actual consumption by NetShield itself is negligible (~1–2%).`,
                  `🔋 **Battery drain concern:**\nSince NetShield runs as a \`VpnService\`, Android lumps all DNS traffic it routes into NetShield's battery stats. The app itself barely uses any power (~1–2%); what you see in Settings is mostly passthrough traffic.`,
                ],
              },
              {
                id: "multi-vpn",
                match: /\b(another vpn|wireguard|openvpn|dual vpn|expressvpn|nordvpn|proton ?vpn|mullvad|warp|always[- ]on vpn)\b/,
                tips: [
                  `🔌 **Regarding Running Multiple VPNs:**\nAndroid allows only **one active \`VpnService\` at a time**. Running NetShield next to WireGuard, ExpressVPN or any other VPN app makes one of them disconnect automatically.`,
                  `🔌 **Two VPNs at once?**\nAndroid's \`VpnService\` only supports **one active connection**. If you launch NetShield while another VPN is running (WireGuard, ExpressVPN, etc.), one of them will drop. Pick one at a time for best results.`,
                ],
              },
              {
                id: "private-dns",
                match: /\b(private dns|settings dns|dns[- ]over[- ]tls in settings)\b/,
                tips: [
                  `⚙️ **Regarding Android "Private DNS":**\nIf **Private DNS** is ON in system settings (\`Settings → Network & Internet → Private DNS\`), it can block NetShield's local encrypted tunnel socket binding. Set it to **Off** or **Automatic** so DoT/DoH can resolve properly.`,
                  `⚙️ **Android "Private DNS" conflict:**\nAndroid's built-in Private DNS setting can clash with NetShield's encrypted tunnel. Please set \`Settings → Network & Internet → Private DNS\` to **Off** or **Automatic** and try again.`,
                ],
              },
              {
                id: "host-resolution",
                match: /(unknownhostexception|eai_nodata|unable to resolve host|sockettimeoutexception|ssl(handshake)?exception|connection (timed out|refused))/,
                tips: [
                  `🌐 **Regarding Host Resolution / Connection Errors:**\nThe encrypted upstream DNS endpoint couldn't be reached over port 853 (DoT) or 443 (DoH).\n* Check whether your Wi-Fi or mobile ISP blocks outgoing TLS port 853.\n* Enable **Auto-Switch to UDP Fallback** in NetShield settings, or verify your Bootstrap DNS IP is intact.`,
                  `🌐 **DNS resolution / connection error:**\nLooks like the encrypted upstream (DoT/DoH) is unreachable. Common causes:\n* ISP blocks outbound port 853.\n* Bootstrap DNS not reachable.\nFix: enable **Auto-Switch to UDP Fallback** in NetShield, or check whether your network blocks DoT.`,
                ],
              },
              {
                id: "killed-in-background",
                match: /\b(stops? (working|running)|keeps? (stopping|closing|disconnecting)|killed|disconnects?|not (staying|running) in (the )?background|after (a )?(reboot|restart))\b/,
                tips: [
                  `🛑 **Regarding the app stopping in the background:**\nAggressive OEM battery managers (MIUI, ColorOS, OneUI, etc.) often kill VPN services. Set NetShield's battery mode to **Unrestricted**, lock it in the recents screen, and enable auto-start if your device has that option. See https://dontkillmyapp.com for device-specific steps.`,
                  `🛑 **Background disconnects:**\nMany OEM ROMs (Xiaomi, Oppo, Samsung, etc.) aggressively kill VPN services. Try these:\n* Set battery mode → **Unrestricted**.\n* Lock NetShield in the recent-apps view.\n* Enable auto-start in your device's settings.\nMore device-specific tips: https://dontkillmyapp.com`,
                ],
              },
              {
                id: "slow",
                match: /\b(slow(er)?|latency|lag(gy|ging)?|high ping|page(s)? (load|loading) (slow|forever))\b/,
                tips: [
                  `🐢 **Regarding slow browsing:**\nA slow upstream resolver or blocked DoT port causes long DNS waits. Try a different upstream provider in NetShield, and enable UDP fallback if your network blocks port 853.`,
                  `🐢 **Slow browsing:**\nUsually caused by a sluggish upstream resolver or a blocked DoT port. Try switching to a different upstream DNS in NetShield's settings, and enable the UDP fallback if your network blocks port 853.`,
                ],
              },
              {
                id: "site-broken",
                match: /\b(website|site|app|page)s?\b.{0,40}\b(not (loading|working|opening)|broken|blocked|won'?t (load|open))\b|\bfalse positive\b/,
                tips: [
                  `🚫 **Regarding a site or app that breaks:**\nA blocklist entry may be catching a legitimate domain. Check NetShield's query log for the blocked domain and add it to your **allowlist**. If it's a false positive in a default list, include the domain in this issue so we can report it upstream.`,
                  `🚫 **Site or app not loading:**\nThis is usually a blocklist false positive. Look in NetShield's query log for the blocked domain, then add it to your **allowlist**. If it's clearly a mistake in one of our default lists, drop the domain here and we'll report it upstream.`,
                ],
              },
            ];

            const hits = FAQ.filter((f) => f.match.test(text));
            if (hits.length) {
              const FAQ_INTROS = [
                `🤖 **Automated Helper & Frequently Asked Questions** 💡\n\nBased on your report, these might help right away:`,
                `🤖 **Quick helper — these tips may match your report:** 💡`,
                `💡 **Automated suggestions based on your report:**`,
                `🤖 **Bot here — I spotted a few things that might help:** 💡`,
              ];
              const FAQ_OUTROS = [
                `\n\n---\n✨ **Did this solve your problem?**\n* **Yes:** please click **"Close issue"** below. 😊\n* **No:** reply with extra context and the developer will take a look. 🚀`,
                `\n\n---\n✨ **Did that help?**\n* **Yes →** close the issue below. 😊\n* **No →** reply here and the developer will jump in. 🚀`,
                `\n\n---\n✨ **Did this fix it?**\n* **Yes:** feel free to close the issue. 😊\n* **No:** reply with more details and we'll take it from there. 🚀`,
              ];
              await say("faq",
                pick(FAQ_INTROS) + `\n\n` +
                hits.map((h) => pick(h.tips)).join("\n\n---\n\n") +
                pick(FAQ_OUTROS));
            }

            // ==========================================
            // 📚 WIKI DISCOVERY
            // ==========================================
            try {
              const fs = require("fs");
              const nodePath = require("path");
              const wikiDir = nodePath.join(process.env.GITHUB_WORKSPACE, "wiki");

              const diagnosticLog = field("Diagnostic Log") || field("Logcat") || field("Log") || "";

              if (fs.existsSync(wikiDir)) {
                const STOP = new Set(("the and for with not you your this that have has had was were are but can cant dont " +
                  "does did when after before from into out all any app apps issue bug version stable release releases " +
                  "download downloaded github droid fdroid apk pure android tag commit hash build builds test prerelease " +
                  "steps expected actual behavior behaviour describe reproduce problem using use used get got just also " +
                  "please thanks netshield dns resolver psbdx").split(" "));
                const tok = (s) => s.toLowerCase().replace(/[^a-z0-9\s]/g, " ")
                  .split(/\s+/).filter((w) => w.length > 2 && !STOP.has(w));

                const query = new Map();
                for (const w of tok(issue.title)) query.set(w, (query.get(w) || 0) + 3);
                for (const w of tok(body.replace(/^###.*$/gm, ""))) query.set(w, (query.get(w) || 0) + 1);

                const pages = fs.readdirSync(wikiDir).filter((f) => f.endsWith(".md") && !f.startsWith("_"));
                const scored = [];
                for (const file of pages) {
                  const base = file.replace(/\.md$/, "");
                  const content = fs.readFileSync(nodePath.join(wikiDir, file), "utf8");
                  const nameToks = new Set(tok(base.replace(/-/g, " ")));
                  const headToks = new Set(tok((content.match(/^#+ .*$/gm) || []).join(" ")));
                  const bodyToks = tok(content);
                  const counts = new Map();
                  for (const w of bodyToks) counts.set(w, (counts.get(w) || 0) + 1);

                  let score = 0;
                  const matched = [];
                  for (const [w, q] of query) {
                    let s = 0;
                    if (nameToks.has(w)) s += q * 4;
                    if (headToks.has(w)) s += q * 2;
                    if (counts.has(w)) s += q * Math.min(counts.get(w), 3) * 0.5;
                    if (s > 0) { score += s; matched.push(w); }
                  }

                  if (diagnosticLog) {
                    const codeBlocks = content.match(/```[\s\S]*?```/g) || [];
                    for (const block of codeBlocks) {
                      const cleanBlock = block.replace(/```\w*\n?/, "").replace(/```$/, "").trim();
                      if (!cleanBlock) continue;
                      const blockToks = new Set(tok(cleanBlock));
                      if (blockToks.size === 0) continue;
                      let overlap = 0;
                      for (const bt of blockToks) {
                        if (diagnosticLog.toLowerCase().includes(bt)) overlap++;
                      }
                      const ratio = overlap / blockToks.size;
                      if (ratio >= 0.4) {
                        score += 15;
                        matched.push("code-block");
                      }
                    }
                  }

                  if (matched.length >= 2 && score >= 8) {
                    scored.push({ base, score, matched: matched.slice(0, 4) });
                  }
                }

                scored.sort((a, b) => b.score - a.score);
                const top = scored.slice(0, 2);
                if (top.length) {
                  const WIKI_INTROS = [
                    `📚 **I found some wiki docs that might help:**\n\n`,
                    `📚 **Wiki suggestions — these pages may cover your problem:**\n\n`,
                    `📖 **Documentation match — check these out:**\n\n`,
                    `📚 **I think the wiki has something for you:**\n\n`,
                  ];
                  const WIKI_OUTROS = [
                    `\n\nThis is an automatic keyword match, so it may not be exact. If it doesn't help, just reply here and the developer will take a look. 🚀`,
                    `\n\n(Auto-matched by keywords, so it may be off — reply here if it doesn't help and the developer will dive in. 🚀)`,
                    `\n\nIt's a best-effort match. If it doesn't solve your issue, just reply and we'll take it from there. 🚀`,
                  ];
                  await say("wiki",
                    pick(WIKI_INTROS) +
                    top.map((p) =>
                      `* [${p.base.replace(/-/g, " ")}](https://github.com/${owner}/${repo}/wiki/${encodeURIComponent(p.base)})` +
                      ` _(matched: ${p.matched.join(", ")})_`).join("\n") +
                    pick(WIKI_OUTROS));
                }
              }
            } catch (e) {
              core.warning(`Wiki discovery skipped: ${e.message}`);
            }

            // ==========================================
            // 🔍 POSSIBLE DUPLICATES
            // ==========================================
            {
              try {
                const stop = new Set(["the","and","for","with","not","app","netshield","issue","bug","when","after","but","this","that","does","doesn't","cannot","can't","working","error"]);
                const words = issue.title.toLowerCase().replace(/[^a-z0-9\s]/g, " ")
                  .split(/\s+/).filter((w) => w.length > 3 && !stop.has(w)).slice(0, 6);
                if (words.length >= 2) {
                  const q = `repo:${owner}/${repo} is:issue is:open in:title ${words.join(" ")}`;
                  const { data } = await github.rest.search.issuesAndPullRequests({ q, per_page: 5 });
                  const related = data.items.filter((i) => i.number !== issueNumber).slice(0, 3);
                  if (related.length) {
                    await addLabel("duplicate-suspected").catch(() => {});
                    const DUP_INTROS = [
                      `🔍 **Possibly related open issues:**\n\n`,
                      `🔍 **These open issues look related:**\n\n`,
                      `🔍 **Heads up — these might be duplicates:**\n\n`,
                    ];
                    const DUP_OUTROS = [
                      `\n\nIf one of these matches your problem, please add your details there. A maintainer will confirm whether this is a duplicate.`,
                      `\n\nIf any of these match what you're seeing, feel free to add your info there. A maintainer will confirm whether this is a duplicate.`,
                      `\n\nIf one of these describes the same issue, please drop your details in that thread. A maintainer will verify.`,
                    ];
                    await say("related",
                      pick(DUP_INTROS) +
                      related.map((i) => `* #${i.number}: ${safe(i.title, 100)}`).join("\n") +
                      pick(DUP_OUTROS));
                  }
                }
              } catch (e) {
                core.warning(`Duplicate search skipped: ${e.message}`);
              }
            }

  # ==========================================
  # ⏳ COUNTDOWN MANAGER (start / cancel from comments)
  # ==========================================
  countdown-manager:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.sender.type != 'Bot' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Handle countdown
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const comment = context.payload.comment;
            const body = comment.body || "";

            if (issue.state === "closed") return;

            const REPORTER = issue.user.login;
            const commenter = comment.user.login;
            const isMaintainer = ["OWNER", "MEMBER", "COLLABORATOR"].includes(comment.author_association);

            const CD_LABEL = "auto-close-pending";
            const MARKER_RE = /<!--\s*netshield-bot:countdown\s+deadline="([^"]+)"\s+maintainer="([^"]+)"\s*-->/;

            // Find existing countdown comment
            async function findCountdownComment() {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issueNumber, per_page: 100,
              });
              return comments.find((c) => c.user?.type === "Bot" && /netshield-bot:countdown/.test(c.body || ""));
            }

            // Parse a maintainer's comment for a countdown directive
            function parseCountdown(text) {
              if (!text) return null;
              // Negation guard: skip "won't close", "will not close", etc.
              if (/\b(?:won'?t|will\s+not|never|no)\s+(?:be\s+)?(?:auto[- ]?|automatically\s+)?clos/i.test(text)) return null;

              const m = text.match(/\bclos(?:e[sd]?|ing)\b[\s\S]{0,100}?\b(?:in|after)\s+(\d+)\s*(minutes?|mins?|m|hours?|hrs?|h|days?|d)\b/i);
              if (!m) return null;
              const n = parseInt(m[1], 10);
              if (!n || n <= 0 || n > 10000) return null;
              const unit = m[2].toLowerCase();
              let ms;
              let human;
              if (unit === "m" || /^min/.test(unit)) { ms = n * 60 * 1000; human = `${n} minute${n === 1 ? "" : "s"}`; }
              else if (unit === "h" || /^h/.test(unit)) { ms = n * 60 * 60 * 1000; human = `${n} hour${n === 1 ? "" : "s"}`; }
              else if (unit === "d" || /^d/.test(unit)) { ms = n * 24 * 60 * 60 * 1000; human = `${n} day${n === 1 ? "" : "s"}`; }
              else return null;
              return { ms, human };
            }

            function formatDeadline(date) {
              return date.toISOString().replace("T", " ").replace(/\.\d+Z$/, " UTC");
            }

            // ---------- Path 1: maintainer triggers a countdown ----------
            if (isMaintainer) {
              const parsed = parseCountdown(body);
              if (!parsed) return;

              const deadline = new Date(Date.now() + parsed.ms);
              const deadlineIso = deadline.toISOString();
              const marker = `<!-- netshield-bot:countdown deadline="${deadlineIso}" maintainer="${commenter}" -->`;

              // Ensure label exists
              try { await github.rest.issues.getLabel({ owner, repo, name: CD_LABEL }); }
              catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({
                  owner, repo, name: CD_LABEL, color: "d4c5f9",
                  description: "Bot is counting down to auto-close this issue",
                });
              }

              const visibleBody =
                `${marker}\n` +
                `⏳ **Auto-close countdown started** — based on @${commenter}'s note, this issue will be **automatically closed in ${parsed.human}** (on **${formatDeadline(deadline)}**) unless you reply first.\n\n` +
                `**@${REPORTER}**, if you have anything to add or the issue is still relevant, please reply in this thread before the deadline. Any reply from you will **cancel the countdown** and re-engage the maintainers.\n\n` +
                `_If nothing is needed, no action is required — the bot will close this issue to keep the tracker tidy._ 🤖`;

              const existingCd = await findCountdownComment();
              if (existingCd) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existingCd.id, body: visibleBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber, body: visibleBody,
                });
              }

              // Ensure the label is present
              const { data: freshIssue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              const curLabels = (freshIssue.labels || []).map((l) => (typeof l === "string" ? l : l.name));
              if (!curLabels.includes(CD_LABEL)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [CD_LABEL] });
              }

              // Remove the maintainer as assignee, assign the bot
              let botLogin = null;
              try {
                const { data: me } = await github.rest.users.getAuthenticated();
                botLogin = me.login;
              } catch (e) {
                core.warning(`Could not fetch bot identity: ${e.message}`);
              }

              const curAssignees = (freshIssue.assignees || []).map((a) => a.login);
              // Remove the maintainer if they were assigned
              if (curAssignees.includes(commenter)) {
                try {
                  await github.rest.issues.removeAssignees({
                    owner, repo, issue_number: issueNumber, assignees: [commenter],
                  });
                } catch (e) {
                  core.warning(`Could not remove assignee ${commenter}: ${e.message}`);
                }
              }
              // Assign the bot itself
              if (botLogin && !curAssignees.includes(botLogin)) {
                try {
                  await github.rest.issues.addAssignees({
                    owner, repo, issue_number: issueNumber, assignees: [botLogin],
                  });
                } catch (e) {
                  core.warning(`Could not assign bot: ${e.message}`);
                }
              }

              core.info(`Countdown started for issue #${issueNumber} — deadline ${deadlineIso}`);
              return;
            }

            // ---------- Path 2: reporter replies → cancel countdown ----------
            if (commenter === REPORTER) {
              const cd = await findCountdownComment();
              if (!cd) return;

              const m = (cd.body || "").match(MARKER_RE);
              const maintainer = m ? m[2] : null;

              // Remove label
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: issueNumber, name: CD_LABEL,
                });
              } catch (e) {
                if (e.status !== 404) core.warning(`Could not remove label: ${e.message}`);
              }

              // Update the countdown comment to say "cancelled"
              const cancelledBody =
                `${cd.body.split("\n")[0]}\n` +
                `✅ **Countdown cancelled** — @${REPORTER} replied, so this issue **won't be auto-closed**.\n\n` +
                (maintainer ? `Re-engaging **@${maintainer}** — please continue the conversation as needed. 🙏\n\n` : ``) +
                `_The bot has stopped the close countdown for this issue._ 🤖`;

              try {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: cd.id, body: cancelledBody,
                });
              } catch (e) {
                core.warning(`Could not update countdown comment: ${e.message}`);
              }

              // Reassign to maintainer, remove the bot
              let botLogin = null;
              try {
                const { data: me } = await github.rest.users.getAuthenticated();
                botLogin = me.login;
              } catch (e) {
                core.warning(`Could not fetch bot identity: ${e.message}`);
              }

              const { data: freshIssue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              const curAssignees = (freshIssue.assignees || []).map((a) => a.login);

              if (botLogin && curAssignees.includes(botLogin)) {
                try {
                  await github.rest.issues.removeAssignees({
                    owner, repo, issue_number: issueNumber, assignees: [botLogin],
                  });
                } catch (e) {
                  core.warning(`Could not remove bot assignee: ${e.message}`);
                }
              }
              if (maintainer && !curAssignees.includes(maintainer)) {
                try {
                  await github.rest.issues.addAssignees({
                    owner, repo, issue_number: issueNumber, assignees: [maintainer],
                  });
                } catch (e) {
                  core.warning(`Could not re-add maintainer ${maintainer}: ${e.message}`);
                }
              }

              core.info(`Countdown cancelled for issue #${issueNumber} (reporter replied).`);
            }

  # ==========================================
  # ⏳ COUNTDOWN SWEEP (every 15 min)
  # ==========================================
  countdown-sweep:
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Close expired countdowns
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const CD_LABEL = "auto-close-pending";
            const MARKER_RE = /<!--\s*netshield-bot:countdown\s+deadline="([^"]+)"\s+maintainer="([^"]+)"\s*-->/;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: CD_LABEL, per_page: 100,
            });

            if (issues.length === 0) {
              core.info("No countdown issues to process.");
              return;
            }

            const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

            for (const i of issues) {
              if (i.pull_request) continue;

              try {
                // Find the countdown marker comment
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: i.number, per_page: 100,
                });
                const cd = comments.find((c) => c.user?.type === "Bot" && /netshield-bot:countdown/.test(c.body || ""));
                if (!cd) {
                  // Label is stale — remove it
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: i.number, name: CD_LABEL });
                  } catch (_) {}
                  continue;
                }

                const m = (cd.body || "").match(MARKER_RE);
                if (!m) {
                  try { await github.rest.issues.removeLabel({ owner, repo, issue_number: i.number, name: CD_LABEL }); } catch (_) {}
                  continue;
                }
                const deadline = new Date(m[1]);
                const maintainer = m[2];
                const reporter = i.user.login;

                // Safety: check for a reporter reply after the countdown started
                const cdCreated = new Date(cd.created_at).getTime();
                const reporterReplied = comments.some((c) =>
                  c.user?.login === reporter && new Date(c.created_at).getTime() > cdCreated
                );

                if (reporterReplied) {
                  // Cancel the countdown instead of closing
                  const cancelledBody =
                    `${(cd.body || "").split("\n")[0]}\n` +
                    `✅ **Countdown cancelled** — @${reporter} replied, so this issue won't be auto-closed.\n\n` +
                    (maintainer ? `Re-engaging **@${maintainer}**. 🙏\n\n` : ``) +
                    `_The bot has stopped the close countdown for this issue._ 🤖`;

                  try {
                    await github.rest.issues.updateComment({ owner, repo, comment_id: cd.id, body: cancelledBody });
                  } catch (_) {}
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: i.number, name: CD_LABEL });
                  } catch (_) {}

                  // Reassign to maintainer
                  let botLogin = null;
                  try {
                    const { data: me } = await github.rest.users.getAuthenticated();
                    botLogin = me.login;
                  } catch (_) {}

                  const curAssignees = (i.assignees || []).map((a) => a.login);
                  if (botLogin && curAssignees.includes(botLogin)) {
                    try {
                      await github.rest.issues.removeAssignees({ owner, repo, issue_number: i.number, assignees: [botLogin] });
                    } catch (_) {}
                  }
                  if (maintainer && !curAssignees.includes(maintainer)) {
                    try {
                      await github.rest.issues.addAssignees({ owner, repo, issue_number: i.number, assignees: [maintainer] });
                    } catch (_) {}
                  }
                  core.info(`Countdown cancelled for #${i.number} (reporter reply detected).`);
                  continue;
                }

                if (Date.now() < deadline.getTime()) {
                  core.info(`#${i.number} countdown still active until ${deadline.toISOString()}.`);
                  continue;
                }

                // Deadline expired — close with a message
                const CLOSE_MSGS = [
                  `⏳ **Auto-closing — the countdown has expired.**\n\n` +
                  `@${maintainer} set an auto-close timer on this issue and no reply was received. If you'd still like help, please **open a fresh issue** with the relevant details. 🙏\n\n` +
                  `*This issue has been automatically closed.* 🤖`,

                  `⏳ **Countdown expired — closing this issue.**\n\n` +
                  `The auto-close timer set by @${maintainer} has elapsed without a response. If the problem is still relevant, feel free to **open a new issue** and we'll take a look. 🙏\n\n` +
                  `*This issue has been automatically closed.* 🤖`,

                  `⏳ **Auto-close timer elapsed — closing.**\n\n` +
                  `@${maintainer}'s countdown finished without a follow-up. Please **open a fresh issue** if you'd like us to revisit this. Thanks for understanding! 🙏\n\n` +
                  `*This issue has been automatically closed.* 🤖`,
                ];

                try {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: i.number, body: pick(CLOSE_MSGS),
                  });
                } catch (_) {}

                await github.rest.issues.update({
                  owner, repo, issue_number: i.number, state: "closed", state_reason: "not_planned",
                });

                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: i.number, name: CD_LABEL });
                } catch (_) {}

                core.info(`Auto-closed #${i.number} (countdown expired).`);
              } catch (e) {
                core.warning(`Could not process countdown for #${i.number}: ${e.message}`);
              }
            }

  # ==========================================
  # 🎉 AUTO-CLOSE ISSUES MENTIONED IN A RELEASE
  # ==========================================
  close-issues-on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Close referenced open issues
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const release = context.payload.release;
            const body = release.body || "";
            const tag = release.tag_name;
            const releaseUrl = release.html_url;

            const nums = new Set();
            for (const m of body.matchAll(/(?<![\w/-])#(\d+)\b/g)) nums.add(Number(m[1]));
            const urlRe = new RegExp(`https://github\\.com/${owner}/${repo}/issues/(\\d+)\\b`, "g");
            for (const m of body.matchAll(urlRe)) nums.add(Number(m[1]));

            if (nums.size === 0) {
              core.info("No issue references found in the release notes.");
              return;
            }

            const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

            const HEADLINES_FEATURE = [
              ({ u }) => `🎉 **Great news, @${u} — your feature request has shipped!** 🚀`,
              ({ u }) => `🎉 **@${u}, your feature request just landed!** 🚀`,
              ({ u }) => `✨ **Good news, @${u} — the feature you requested is now live!** 🎉`,
              ({ u }) => `🚀 **@${u}, we shipped your feature request!** 🎉`,
              ({ u }) => `🎉 **Feature delivered, @${u}!** Thanks for the great idea. 🚀`,
              ({ u }) => `🌟 **@${u}, your suggestion is now part of NetShield!** 🎉`,
            ];
            const HEADLINES_BUG = [
              ({ u }) => `🎉 **Great news, @${u} — this has been fixed!** ✅`,
              ({ u }) => `✅ **@${u}, this bug is now resolved!** 🎉`,
              ({ u }) => `🎉 **Fixed and shipped, @${u}!** ✅`,
              ({ u }) => `✅ **Good news, @${u} — the issue is resolved!** 🎉`,
              ({ u }) => `🎉 **@${u}, your report has been fixed!** Thanks for flagging it. ✅`,
              ({ u }) => `🛠️ **All patched up, @${u}!** The fix is live. ✅`,
            ];

            const BODY_FEATURE = [
              ({ tag, releaseUrl }) => `Our developers have implemented the feature you asked for and it's now available in **[\`${tag}\`](${releaseUrl})**.`,
              ({ tag, releaseUrl }) => `The feature you suggested is now live in **[\`${tag}\`](${releaseUrl})**. Thanks for helping shape NetShield!`,
              ({ tag, releaseUrl }) => `We've built and shipped your requested feature in **[\`${tag}\`](${releaseUrl})**. 🎉`,
              ({ tag, releaseUrl }) => `Your idea made it into **[\`${tag}\`](${releaseUrl})** — enjoy! 🎉`,
            ];
            const BODY_BUG = [
              ({ tag, releaseUrl }) => `Our developers have resolved this issue and the fix is now available in **[\`${tag}\`](${releaseUrl})**.`,
              ({ tag, releaseUrl }) => `The fix for this landed in **[\`${tag}\`](${releaseUrl})**. Thanks for reporting it!`,
              ({ tag, releaseUrl }) => `We've fixed this and shipped the update in **[\`${tag}\`](${releaseUrl})**. ✅`,
              ({ tag, releaseUrl }) => `The bug is gone as of **[\`${tag}\`](${releaseUrl})**. Thanks for helping us catch it!`,
            ];

            const HOWTO = [
              `### 📦 How to get the update\n\n` +
              `**🟢 Using F-Droid?**\n` +
              `Please **wait 1–2 days**. The new version will appear on F-Droid as soon as the F-Droid maintainers review and accept our merge request. ` +
              `We'd **not recommend** downloading the GitHub release version if you're an F-Droid user — the F-Droid build is signed with a different key, and mixing the two can cause install conflicts or data loss.\n\n` +
              `**🔵 Using GitHub Releases / APK Pure?**\n` +
              `You can update right away.`,

              `### 📦 Getting the update\n\n` +
              `**🟢 On F-Droid?**\n` +
              `Hang tight for **1–2 days** — the new build will appear on F-Droid once the F-Droid maintainers merge our submission. ` +
              `Please **don't install the GitHub release on top of an F-Droid install** — the signing keys differ, which can cause install conflicts or data loss.\n\n` +
              `**🔵 On GitHub Releases / APK Pure?**\n` +
              `You can update immediately.`,

              `### 📦 How to update\n\n` +
              `**🟢 F-Droid users:** please wait **1–2 days** for the F-Droid maintainers to accept our merge request. ` +
              `We **strongly advise against** installing the GitHub release version on top of an F-Droid install — different signing keys can break the app or wipe your data.\n\n` +
              `**🔵 GitHub / APK Pure users:** update whenever you like.`,

              `### 📦 Update instructions\n\n` +
              `**🟢 F-Droid:** the new version should appear **in 1–2 days** once the F-Droid maintainers accept the merge request. ` +
              `**Do not** install the GitHub release over an F-Droid install — different signing keys mean install conflicts or potential data loss.\n\n` +
              `**🔵 GitHub Releases / APK Pure:** update immediately.`,
            ];

            const WHY = [
              `### 🤖 Why was this closed automatically?\n` +
              `This issue was mentioned in the release notes for \`${tag}\`, which means our developers have finished working on it. ` +
              `The bot closed it automatically to keep the tracker tidy — no action is needed from you.\n\n` +
              `If the problem persists on \`${tag}\`, or if the new feature doesn't behave as expected, just **open a fresh issue** and we'll take another look. 🙏`,

              `### 🤖 Why the auto-close?\n` +
              `Because this issue was referenced in the \`${tag}\` release notes, our bot assumed it's been handled and closed it to keep things clean.\n\n` +
              `If you still see the problem on \`${tag}\` — or the new feature isn't quite right — please **open a new issue** and we'll dig in. 🙏`,

              `### 🤖 About this auto-close\n` +
              `This issue appeared in the \`${tag}\` release notes, so the bot closed it automatically. Nothing you need to do.\n\n` +
              `If anything's still off on \`${tag}\`, just **open a fresh issue** — we'd rather hear about it than miss it. 🙏`,

              `### 🤖 Why did the bot close this?\n` +
              `Because the \`${tag}\` release notes referenced this issue, our bot treated it as resolved and closed it. No action needed from you.\n\n` +
              `If the problem (or the new feature) isn't quite right on \`${tag}\`, **just open a fresh issue** — we'll pick it up quickly. 🙏`,
            ];

            for (const n of nums) {
              try {
                const { data: iss } = await github.rest.issues.get({
                  owner, repo, issue_number: n,
                });

                if (iss.pull_request) {
                  core.info(`#${n} is a PR; skipping.`);
                  continue;
                }
                if (iss.state === "closed") {
                  core.info(`#${n} is already closed; skipping.`);
                  continue;
                }

                const labels = (iss.labels || []).map((l) => (typeof l === "string" ? l : l.name));
                const labelNames = labels.join(" ").toLowerCase();
                const bodyLower = (iss.body || "").toLowerCase();
                const looksLikeFeature =
                  labelNames.includes("feature") ||
                  labelNames.includes("enhancement") ||
                  bodyLower.includes("feature category");

                const headline = pick(looksLikeFeature ? HEADLINES_FEATURE : HEADLINES_BUG)({ u: iss.user.login });
                const intro = pick(looksLikeFeature ? BODY_FEATURE : BODY_BUG)({ tag, releaseUrl });

                await github.rest.issues.createComment({
                  owner, repo, issue_number: n,
                  body:
                    `${headline}\n\n` +
                    `${intro}\n\n` +
                    `---\n\n` +
                    `${pick(HOWTO)}\n\n` +
                    `---\n\n` +
                    `${pick(WHY)}`,
                });

                await github.rest.issues.update({
                  owner, repo, issue_number: n,
                  state: "closed", state_reason: "completed",
                });

                core.info(`Closed #${n}.`);
              } catch (e) {
                core.warning(`Could not close #${n}: ${e.message}`);
              }
            }

  stale-sweep:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Close stale on-hold issues
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "on-hold", per_page: 100,
            });

            const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
            const MSGS = [
              `⏳ **Closing due to inactivity.** This issue stayed **On Hold** for 7 days without the required information.\n\nFeel free to open a new issue with the complete details. 🤖`,
              `⏳ **Auto-closing — no response for 7 days.** The issue was waiting on additional information.\n\nIf you'd still like help, just open a fresh issue with the missing details. 🤖`,
              `⏳ **Closing this one — it's been idle for 7 days while On Hold.** No worries at all; open a new issue any time with the details and we'll pick it up. 🤖`,
            ];

            for (const i of issues) {
              if (i.pull_request) continue;
              if (new Date(i.updated_at).getTime() > cutoff) continue;

              await github.rest.issues.createComment({
                owner, repo, issue_number: i.number,
                body: pick(MSGS),
              });
              await github.rest.issues.update({
                owner, repo, issue_number: i.number, state: "closed", state_reason: "not_planned",
              });
            }

  # ==========================================
  # 🆕 AUTO-MILESTONE FROM MAINTAINER COMMENTS
  # ==========================================
  auto-milestone:
    if: github.event_name == 'issue_comment' && github.event.action == 'created'
    runs-on: ubuntu-latest
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Assign milestone from maintainer comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue.number;
            const comment = context.payload.comment;
            const body = comment.body || "";

            const MAINTAINER_ROLES = ["OWNER", "MEMBER", "COLLABORATOR"];
            if (!MAINTAINER_ROLES.includes(comment.author_association)) return;
            if (context.payload.issue.state !== "open") return;

            const labels = (context.payload.issue.labels || []).map((l) => (typeof l === "string" ? l : l.name));
            const labelNames = labels.join(" ").toLowerCase();
            const issueBody = (context.payload.issue.body || "").toLowerCase();
            const isFeatureRequest =
              labelNames.includes("feature") ||
              labelNames.includes("enhancement") ||
              issueBody.includes("feature category");

            if (!isFeatureRequest) {
              core.info(`Issue #${issueNumber} is not a feature request; skipping milestone.`);
              return;
            }

            const match = body.match(/\bv?(\d+\.\d+\.\d+)\b/i);
            if (!match) return;
            const version = match[1];
            const title = `v${version}`;

            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number: issueNumber,
            });
            if (issue.milestone) {
              core.info(`Issue #${issueNumber} already has milestone: ${issue.milestone.title}`);
              return;
            }

            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner, repo, state: "all", per_page: 100,
            });
            let milestone = milestones.find((m) => m.title === title);
            if (!milestone) {
              core.info(`Creating new milestone: ${title}`);
              milestone = (await github.rest.issues.createMilestone({
                owner, repo, title,
                description: `Targeted for release ${title}`,
              })).data;
            }

            await github.rest.issues.update({
              owner, repo, issue_number: issueNumber, milestone: milestone.number,
            });

            core.info(`Milestone "${title}" assigned to issue #${issueNumber}.`);