name: Issue Filter & Smart Assistant

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created] # the reporter's reply with their app version
  schedule:
    - cron: "0 3 * * *" # daily sweep for stale on-hold issues

# One run per issue at a time. Runs triggered by the bot's own comments get a separate
# group (and are skipped below) so they can never cancel or replace a real run.
concurrency:
  group: issue-assistant-${{ github.event.issue.number || 'sweep' }}-${{ github.event.sender.type == 'Bot' && 'bot' || 'user' }}
  cancel-in-progress: false

permissions: {}

jobs:
  filter-and-answer:
    if: >-
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && github.event.sender.type != 'Bot' && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: read # only used to clone the wiki for documentation lookup
    steps:
      # Mint a short-lived token for the GitHub App so comments/labels
      # appear under the bot's own identity (e.g. "netshield-bot[bot]").
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write

      # The wiki is a separate git repo (<repo>.wiki) that only exists once the
      # first page is created. A failed clone is just a notice, not an error.
      - name: Fetch wiki (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki 2>/dev/null \
            || echo "::notice::No wiki found yet. Create a first wiki page to enable documentation suggestions."

      - name: Process issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const issueNumber = issue.number;
            const body = issue.body || "";
            const action = context.payload.action;

            // ---------- Guards ----------
            if (issue.pull_request) return;
            if (context.payload.sender?.type === "Bot") return;
            if (issue.state === "closed") return; // don't resurrect/reprocess closed issues
            // Set to false while testing with your own account, otherwise your own issues are skipped
            const SKIP_MAINTAINERS = false;
            const isMaintainer = ["OWNER", "MEMBER", "COLLABORATOR"].includes(issue.author_association);
            if (SKIP_MAINTAINERS && isMaintainer) {
              core.info("Author is a maintainer; skipping automation.");
              return;
            }

            // ---------- Conversation guards ----------
            const isComment = context.eventName === "issue_comment";
            const REPORTER = issue.user.login;
            const issueLabels = (issue.labels || []).map((l) => (typeof l === "string" ? l : l.name));
            if (isComment) {
              // Only the reporter's replies matter, and only while we're waiting on them
              if (context.payload.comment.user.login !== REPORTER) return;
              if (!issueLabels.includes("on-hold")) return;
            } else if (action === "edited" && issueLabels.includes("handed-over-to-developer")) {
              return; // already triaged: don't re-apply labels/assignee on every edit
            }

            // ---------- Helpers ----------
            const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

            // Read a GitHub Issue Form field by its heading; treats "_No response_" as empty
            function field(header) {
              const re = new RegExp(`### ${esc(header)}\\s*\\n\\s*([\\s\\S]*?)(?=\\n### |$)`, "i");
              const m = body.match(re);
              const v = m ? m[1].trim() : "";
              return /^_?no response_?$/i.test(v) ? "" : v;
            }

            // Make user-provided text safe to echo in a comment
            const safe = (s, max = 80) =>
              s.replace(/[`\r\n]/g, " ").replace(/@/g, "@\u200b").trim().slice(0, max);

            const MARK = (key) => `<!-- netshield-bot:${key} -->`;
            const MANAGED = {
              "on-hold": { color: "fbca04", description: "Waiting for required info from the reporter" },
              "handed-over-to-developer": { color: "0e8a16", description: "Validated and queued for the developer" },
              "invalid-source": { color: "b60205", description: "Reported from an unofficial download source" },
              "duplicate-suspected": { color: "cfd3d7", description: "Bot found possibly related issues" },
            };

            async function ensureLabel(name) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner, repo, name, ...MANAGED[name] });
              }
            }

            const DEVELOPER = "m-farhan-hamim";
            // Versions below this are no longer supported (reports are closed with a friendly note)
            const MIN_SUPPORTED = [3, 0, 0];
            // How the reported app version is tracked on bug reports: "milestone" | "label"
            const VERSION_MODE = "label";

            // Replace only the bot's workflow-status labels; keep everything else (bug, donation, ...)
            // Also keeps the developer assignment in sync with the status.
            const STATUS = ["on-hold", "handed-over-to-developer"];
            async function setStatus(target) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              const current = data.labels.map((l) => (typeof l === "string" ? l : l.name));
              const next = current.filter((l) => !STATUS.includes(l));
              if (target) { await ensureLabel(target); next.push(target); }
              if (!(next.length === current.length && next.every((l) => current.includes(l)))) {
                await github.rest.issues.setLabels({ owner, repo, issue_number: issueNumber, labels: next });
              }

              const assigned = (data.assignees || []).some((a) => a.login === DEVELOPER);
              try {
                if (target === "handed-over-to-developer" && !assigned) {
                  await github.rest.issues.addAssignees({ owner, repo, issue_number: issueNumber, assignees: [DEVELOPER] });
                } else if (target === "on-hold" && assigned) {
                  // info is missing again, so it's not the developer's turn yet
                  await github.rest.issues.removeAssignees({ owner, repo, issue_number: issueNumber, assignees: [DEVELOPER] });
                }
              } catch (e) {
                core.warning(`Assignee update failed: ${e.message}`);
              }
            }

            // Track the app version the bug was reported on
            async function trackVersion(ver, tag = `v${ver}`) {
              const title = `v${ver}`;
              if (VERSION_MODE === "label") {
                const label = `affects-${tag}`;
                try { await github.rest.issues.getLabel({ owner, repo, name: label }); }
                catch (e) {
                  if (e.status !== 404) throw e;
                  await github.rest.issues.createLabel({ owner, repo, name: label, color: "c5def5", description: `Reported on ${tag}` });
                }
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                const names = data.labels.map((l) => (typeof l === "string" ? l : l.name));
                const next = names.filter((n) => !n.startsWith("affects-")).concat(label);
                await github.rest.issues.setLabels({ owner, repo, issue_number: issueNumber, labels: next });
                return;
              }
              // Milestone mode: never overwrite a milestone a maintainer already chose
              if (issue.milestone) return;
              const all = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: "all", per_page: 100 });
              let m = all.find((x) => x.title.replace(/^v/i, "") === ver);
              if (!m) {
                m = (await github.rest.issues.createMilestone({
                  owner, repo, title, description: `Bug reports filed against ${title}`,
                })).data;
              }
              await github.rest.issues.update({ owner, repo, issue_number: issueNumber, milestone: m.number });
            }

            async function addLabel(name) {
              await ensureLabel(name);
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [name] });
            }

            // Upsert: one bot comment per "key" per issue, edited in place instead of spamming
            async function findComment(key) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issueNumber, per_page: 100,
              });
              return comments.find((c) => c.user?.type === "Bot" && c.body?.includes(MARK(key)));
            }
            async function say(key, text) {
              const full = `${MARK(key)}\n${text}`;
              const existing = await findComment(key);
              if (existing) {
                if (existing.body === full) return;
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: full });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: full });
              }
            }

            async function closeWith(key, text) {
              await say(key, text + `\n\n*This issue has been automatically closed.* 🤖`);
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber, state: "closed", state_reason: "not_planned",
              });
            }

            // ==========================================
            // 💖 DONATION / SPONSOR ISSUES
            // ==========================================
            const donationPlatform = field("Which platform did you choose?");

            if (donationPlatform) {
              if (donationPlatform.includes("https://donate.psbdx.com")) {
                await closeWith("donation",
                  `🚧 **Self-Hosted Donation Site Under Construction** 💖\n\n` +
                  `Thank you so much for your generosity and interest in supporting NetShield!\n\n` +
                  `**https://donate.psbdx.com** is still under active development and cannot process payments yet, so transactions there are expected to fail.\n\n` +
                  `🚀 **Alternative:** support us via **https://superchat.bd**, or check back once our self-hosted portal launches!`);
                return;
              }
              if (donationPlatform.includes("https://superchat.bd")) {
                await setStatus("handed-over-to-developer");
                await say("donation",
                  `💖 **Thank You for Your Support!** 🚀\n\n` +
                  `We really appreciate your willingness to back the NetShield project!\n\n` +
                  `🛠️ **Status Update:** We're investigating the issue with **superchat.bd**. This report is tagged **\`handed-over-to-developer\`**.\n\n` +
                  `*If you emailed screenshots to \`support@psbdx.com\`, we'll match them with this issue number (#${issueNumber}).* 📧`);
                return;
              }
            }

            // ==========================================
            // 📋 TEMPLATE DETECTION
            // ==========================================
            const isFeature = body.includes("Feature Category");
            const versionType = field("Version Type");
            const downloadSource = field("Where did you download the app from?");

            if (!versionType && !downloadSource && !donationPlatform && !isFeature) {
              await closeWith("template",
                `🛑 **Invalid Issue Format** 🛑\n\n` +
                `This report doesn't use one of our official **Issue Templates**.\n\n` +
                `📋 **How to Fix:** please open a new issue with the [Bug Report / Feature Request form](https://github.com/${owner}/${repo}/issues/new/choose) so all diagnostic info is captured.`);
              return;
            }
            if (isFeature) return;

            // ==========================================
            // 🧠 PARSE BUG REPORT
            // ==========================================
            const vt = versionType.toLowerCase();
            const selectedChannel = ["nightly", "alpha", "beta", "stable"].find((c) => vt.includes(c)) || "other";

            const src = downloadSource.toLowerCase();
            const isPlayStore = src.includes("play store");
            const isOtherThirdParty = src.includes("other 3rd party");
            const badSource = isPlayStore || isOtherThirdParty;
            const sourceLabel = isPlayStore ? "the Google Play Store" : "an unofficial 3rd-party platform";

            // ==========================================
            // 🛑 STRICT FILTERS (AUTO-CLOSE)
            // ==========================================
            if (badSource) {
              await addLabel("invalid-source").catch(() => {});
              await closeWith("policy",
                `⚠️ **Unofficial Release / Download Warning** 🛡️\n\n` +
                `**NetShield DNS Resolver is NOT published on ${sourceLabel}.**\n\n` +
                `If you installed an app with this name from there, it is an **unofficial or modified build** not maintained by this project.\n\n` +
                `🔒 **Security Recommendation:** uninstall it and get official releases from **GitHub Releases**, **F-Droid**, or **APK Pure**.`);
              return;
            }

            // ==========================================
            // 💬 VERSION CONVERSATION
            // The form doesn't ask for the app version. The bot asks in a comment and reads the reporter's reply.
            // ==========================================
            const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

            // Post a comment only once per key, so re-runs never double-post and the wording stays stable
            async function sayOnce(key, text) {
              if (await findComment(key)) return;
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: `${MARK(key)}\n${text}` });
            }

            // "3.1.1", "v3.1.1", "BETA-3.1.1", "beta 3.1.1", "I'm on nightly 3.1.1" -> { channel, nums, ver }
            function parseVersionReply(text) {
              const m = (text || "").slice(0, 500).match(/\b(?:(alpha|beta|nightly)[\s_:-]*)?v?(\d{1,3})\.(\d{1,3})\.(\d{1,3})\b/i);
              if (!m) return null;
              return { channel: m[1] ? m[1].toLowerCase() : null, nums: [+m[2], +m[3], +m[4]], ver: `${m[2]}.${m[3]}.${m[4]}` };
            }

            // Does the reply agree with the Version Type picked in the form? Returns the channel, or null on a mismatch.
            function resolveChannel(p) {
              if (selectedChannel === "other") return p.channel || "prerelease";
              if (p.channel && p.channel !== selectedChannel) return null;
              return selectedChannel;
            }

            // The app's diagnostic log usually starts with "NetShield 3.1.1 | Android ..."
            const logVersion = (body.match(/NetShield\s+(?:(?:alpha|beta|nightly)[\s_:-]*)?v?(\d+\.\d+\.\d+)/i) || [])[1];
            const logHint = logVersion ? `Your diagnostic log mentions \`${logVersion}\`, which is usually the installed version.` : "";

            const HINT = {
              stable: "Just the number is fine, e.g. `3.1.1`.",
              beta: "Since you picked **Beta Build**, something like `BETA-3.1.1` works.",
              alpha: "Since you picked **Alpha Build**, something like `ALPHA-3.1.1` works.",
              nightly: "Since you picked **Nightly Build**, something like `NIGHTLY-3.1.1` works.",
              other: "The release number from GitHub is fine, e.g. `3.2.0`.",
            };

            // Several phrasings for every message so the conversation doesn't read like a template
            const ASK = [
              ({ u, hint }) => `Hey @${u}, thanks for taking the time to report this! 🙏 One quick thing before I pass it along: which version of NetShield are you running? ${hint}`,
              ({ u, hint }) => `Hi @${u}! Got your report. Could you tell me which version of the app you're on? ${hint} Just reply right here.`,
              ({ u, hint }) => `Thanks for the report, @${u}! There's just one thing I'm missing: your app version. ${hint}`,
              ({ u, hint }) => `Hello @${u} 👋 Appreciate you filing this. Which version of NetShield is installed on your phone? ${hint}`,
              ({ u, hint }) => `Hey @${u}, before the developer takes a look I need to know which version you're on. ${hint} A quick reply is all it takes!`,
              ({ u, hint }) => `Nice, thanks @${u}. Last piece of the puzzle: which app version are you using? ${hint} Just reply in this thread.`,
              ({ u, hint }) => `Hi @${u}, thanks for the detailed report! Mind telling me which version of the app this happened on? ${hint}`,
              ({ u, hint }) => `Hey @${u}, got it, thanks! Which version is this happening on? ${hint}`,
            ];
            const NUDGE = [
              ({ u }) => `Hmm, I couldn't spot a version number in that, @${u}. 🤔 Could you send it like \`3.1.1\`? ${logHint}`,
              () => `Thanks for replying! I'm still missing the version though. Something like \`3.1.1\` would do it. ${logHint}`,
              ({ u }) => `Almost there, @${u}! I just need the version number (three numbers, like \`3.1.1\`). ${logHint}`,
              () => `Sorry, I didn't catch a version in that. Mind sending it as \`x.y.z\`, e.g. \`3.1.1\`? ${logHint}`,
              ({ u }) => `No worries if it's hard to find, @${u}. ${logHint} Once you have it, just reply with the number (e.g. \`3.1.1\`).`,
            ];
            const MISMATCH = [
              ({ u, type, said }) => `Hmm, @${u}, you picked **${type}** in the form, but \`${said}\` looks like a different kind of build. 🤔 Could you double-check and send the version again? If the Version Type in the form was wrong, you can also just edit the issue and change it.`,
              ({ u, type, said }) => `Quick sanity check, @${u}: the form says **${type}**, but \`${said}\` doesn't look like that kind of build. Which one is right? Reply with the correct version, or edit the Version Type in the issue if that's what was off.`,
              ({ u, type, said }) => `Thanks! One thing doesn't add up though: you chose **${type}** but \`${said}\` is from a different channel. Mind confirming the version again, @${u}? (Or fix the Version Type by editing the issue.)`,
              ({ u, type, said }) => `Hey @${u}, I think something got mixed up: **${type}** and \`${said}\` don't match. Could you send the right version? You can also edit the issue to change the Version Type.`,
            ];
            const ACK = [
              ({ u, v }) => `Perfect, thanks @${u}! 🙌 Noted **${v}**. I've passed this to the developer and they'll take a look as soon as they're free.`,
              ({ v }) => `Got it, **${v}**. Thanks for confirming! The developer has been notified and will look into it when they get a chance.`,
              ({ u, v }) => `Thanks @${u}, that's everything I needed. 👍 Marked as **${v}** and handed over to the developer.`,
              ({ v }) => `Awesome, thank you! **${v}** noted. This is now in the developer's queue.`,
              ({ v }) => `Great, that helps a lot. Logged **${v}** and sent it over to the developer. 🚀`,
              ({ u, v }) => `Thanks for the quick reply, @${u}! Version **${v}** is on record and the developer will pick this up soon.`,
            ];
            const LEGACY = [
              ({ u, v }) => `Thanks for letting me know, @${u}. 🙏 **${v}** is an older release that's no longer supported, so I can't take bug reports for it. Please update to the **latest stable release** from GitHub Releases, F-Droid, or APK Pure, and open a new issue if the problem is still there.`,
              ({ u, v }) => `Thanks, @${u}! Unfortunately **${v}** is past its support window. Could you update to the **latest stable release** (GitHub Releases, F-Droid, or APK Pure) and check if it still happens? If it does, please open a fresh issue.`,
              ({ u, v }) => `Appreciate the quick reply, @${u}. 📦 That version (**${v}**) has reached end of support, so I'll close this one. Updating to the **latest stable release** often fixes things, and a new issue is welcome if it doesn't.`,
            ];

            // Work out where the conversation stands from the thread itself, so any run can pick up where another stopped
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            const trigger = isComment ? context.payload.comment : null;
            const thread = trigger && !comments.some((c) => c.id === trigger.id) ? [...comments, trigger] : comments;

            const askComment = thread.find((c) => c.user?.type === "Bot" && c.body?.includes(MARK("ask-version")));
            let accepted = null;
            let lastMismatch = null;
            if (askComment) {
              const replies = thread.filter((c) => c.user?.login === REPORTER && c.id > askComment.id);
              for (const r of replies) {
                const p = parseVersionReply(r.body);
                if (!p) continue;
                const channel = resolveChannel(p);
                if (channel) { accepted = { ...p, channel }; break; }
                lastMismatch = { p, id: r.id };
              }
            }

            // ---- Still waiting for a usable version ----
            if (!accepted) {
              await setStatus("on-hold");
              const ctx = { u: REPORTER, type: safe(versionType), hint: HINT[selectedChannel] };

              if (!askComment) {
                await sayOnce("ask-version", pick(ASK)(ctx).trim());
                return;
              }
              if (isComment) {
                if (lastMismatch && lastMismatch.id === trigger.id) {
                  const said = `${lastMismatch.p.channel ? lastMismatch.p.channel.toUpperCase() + "-" : ""}${lastMismatch.p.ver}`;
                  await sayOnce(`mismatch-${trigger.id}`, pick(MISMATCH)({ ...ctx, said }).trim());
                } else if (!parseVersionReply(trigger.body)) {
                  // Don't nag: at most 3 nudges per issue
                  const nudges = comments.filter((c) => c.user?.type === "Bot" && c.body?.includes("<!-- netshield-bot:nudge-")).length;
                  if (nudges < 3) await sayOnce(`nudge-${trigger.id}`, pick(NUDGE)(ctx).trim());
                }
              }
              return;
            }

            // ---- Got a usable version ----
            const isTestBuild = ["alpha", "beta", "nightly"].includes(accepted.channel);
            const shown = isTestBuild ? `${accepted.channel.toUpperCase()}-${accepted.ver}` : accepted.ver; // 3.1.1 / BETA-3.1.1
            const versionTag = accepted.channel === "stable" ? `v${accepted.ver}` : isTestBuild ? shown : `PRE-${accepted.ver}`;

            const cmp = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            // Test builds (BETA-1.4.0, ...) have their own numbering; the cutoff only applies to stable releases.
            if (!isTestBuild && cmp(accepted.nums, MIN_SUPPORTED) < 0) {
              await closeWith("legacy", pick(LEGACY)({ u: REPORTER, v: shown }));
              return;
            }

            // ==========================================
            // ✅ VERSION CONFIRMED -> HAND OVER
            // ==========================================
            await setStatus("handed-over-to-developer");

            // Label the version: 3.1.1 -> affects-v3.1.1, BETA-3.1.1 -> affects-BETA-3.1.1
            try {
              await trackVersion(accepted.ver, versionTag);
            } catch (e) {
              core.warning(`Version tracking failed: ${e.message}`);
            }

            await sayOnce("ack",
              pick(ACK)({ u: REPORTER, v: shown }) +
              (accepted.channel === "stable" ? "" : `\n\nThanks for testing our preview builds, it really helps! 🧪`));

            // ==========================================
            // 💡 SMART FAQ (scored, de-duplicated, one editable comment)
            // ==========================================
            const text = `${issue.title}\n${body}`.toLowerCase();

            const FAQ = [
              {
                id: "battery",
                match: /\b(battery|drain(ing|s|ed)?|power usage|wakelock)\b/,
                tip: `🔋 **Regarding Battery Usage:**\nAndroid attributes all routed traffic to NetShield because it runs as a local \`VpnService\`, so the battery stats menu counts bandwidth passing through the local DNS proxy as CPU use. Actual consumption by NetShield itself is negligible (~1–2%).`,
              },
              {
                id: "multi-vpn",
                match: /\b(another vpn|wireguard|openvpn|dual vpn|expressvpn|nordvpn|proton ?vpn|mullvad|warp|always[- ]on vpn)\b/,
                tip: `🔌 **Regarding Running Multiple VPNs:**\nAndroid allows only **one active \`VpnService\` at a time**. Running NetShield next to WireGuard, ExpressVPN or any other VPN app makes one of them disconnect automatically.`,
              },
              {
                id: "private-dns",
                match: /\b(private dns|settings dns|dns[- ]over[- ]tls in settings)\b/,
                tip: `⚙️ **Regarding Android "Private DNS":**\nIf **Private DNS** is ON in system settings (\`Settings → Network & Internet → Private DNS\`), it can block NetShield's local encrypted tunnel socket binding. Set it to **Off** or **Automatic** so DoT/DoH can resolve properly.`,
              },
              {
                id: "host-resolution",
                match: /(unknownhostexception|eai_nodata|unable to resolve host|sockettimeoutexception|ssl(handshake)?exception|connection (timed out|refused))/,
                tip: `🌐 **Regarding Host Resolution / Connection Errors:**\nThe encrypted upstream DNS endpoint couldn't be reached over port 853 (DoT) or 443 (DoH).\n* Check whether your Wi-Fi or mobile ISP blocks outgoing TLS port 853.\n* Enable **Auto-Switch to UDP Fallback** in NetShield settings, or verify your Bootstrap DNS IP is intact.`,
              },
              {
                id: "killed-in-background",
                match: /\b(stops? (working|running)|keeps? (stopping|closing|disconnecting)|killed|disconnects?|not (staying|running) in (the )?background|after (a )?(reboot|restart))\b/,
                tip: `🛑 **Regarding the app stopping in the background:**\nAggressive OEM battery managers (MIUI, ColorOS, OneUI, etc.) often kill VPN services. Set NetShield's battery mode to **Unrestricted**, lock it in the recents screen, and enable auto-start if your device has that option. See https://dontkillmyapp.com for device-specific steps.`,
              },
              {
                id: "slow",
                match: /\b(slow(er)?|latency|lag(gy|ging)?|high ping|page(s)? (load|loading) (slow|forever))\b/,
                tip: `🐢 **Regarding slow browsing:**\nA slow upstream resolver or blocked DoT port causes long DNS waits. Try a different upstream provider in NetShield, and enable UDP fallback if your network blocks port 853.`,
              },
              {
                id: "site-broken",
                match: /\b(website|site|app|page)s?\b.{0,40}\b(not (loading|working|opening)|broken|blocked|won'?t (load|open))\b|\bfalse positive\b/,
                tip: `🚫 **Regarding a site or app that breaks:**\nA blocklist entry may be catching a legitimate domain. Check NetShield's query log for the blocked domain and add it to your **allowlist**. If it's a false positive in a default list, include the domain in this issue so we can report it upstream.`,
              },
            ];

            const hits = FAQ.filter((f) => f.match.test(text));
            if (hits.length) {
              await say("faq",
                `🤖 **Automated Helper & Frequently Asked Questions** 💡\n\n` +
                `Based on your report, these might help right away:\n\n` +
                hits.map((h) => h.tip).join("\n\n---\n\n") +
                `\n\n---\n✨ **Did this solve your problem?**\n` +
                `* **Yes:** please click **"Close issue"** below. 😊\n` +
                `* **No:** reply with extra context and the developer will take a look. 🚀`);
            }

            // ==========================================
            // 📚 WIKI DISCOVERY (keyword-scored against wiki pages)
            // ==========================================
            try {
              const fs = require("fs");
              const nodePath = require("path");
              const wikiDir = nodePath.join(process.env.GITHUB_WORKSPACE, "wiki");

              if (fs.existsSync(wikiDir)) {
                const STOP = new Set(("the and for with not you your this that have has had was were are but can cant dont " +
                  "does did when after before from into out all any app apps issue bug version stable release releases " +
                  "download downloaded github droid fdroid apk pure android tag commit hash build builds test prerelease " +
                  "steps expected actual behavior behaviour describe reproduce problem using use used get got just also " +
                  "please thanks netshield dns resolver psbdx").split(" "));
                const tok = (s) => s.toLowerCase().replace(/[^a-z0-9\s]/g, " ")
                  .split(/\s+/).filter((w) => w.length > 2 && !STOP.has(w));

                // Query: title words count triple, body words once (form headings stripped)
                const query = new Map();
                for (const w of tok(issue.title)) query.set(w, (query.get(w) || 0) + 3);
                for (const w of tok(body.replace(/^###.*$/gm, ""))) query.set(w, (query.get(w) || 0) + 1);

                const pages = fs.readdirSync(wikiDir).filter((f) => f.endsWith(".md") && !f.startsWith("_"));
                const scored = [];
                for (const file of pages) {
                  const base = file.replace(/\.md$/, "");
                  const content = fs.readFileSync(nodePath.join(wikiDir, file), "utf8");
                  const nameToks = new Set(tok(base.replace(/-/g, " ")));
                  const headToks = new Set(tok((content.match(/^#+ .*$/gm) || []).join(" ")));
                  const bodyToks = tok(content);
                  const counts = new Map();
                  for (const w of bodyToks) counts.set(w, (counts.get(w) || 0) + 1);

                  let score = 0;
                  const matched = [];
                  for (const [w, q] of query) {
                    let s = 0;
                    if (nameToks.has(w)) s += q * 4;
                    if (headToks.has(w)) s += q * 2;
                    if (counts.has(w)) s += q * Math.min(counts.get(w), 3) * 0.5;
                    if (s > 0) { score += s; matched.push(w); }
                  }
                  if (matched.length >= 2 && score >= 8) {
                    scored.push({ base, score, matched: matched.slice(0, 4) });
                  }
                }

                scored.sort((a, b) => b.score - a.score);
                const top = scored.slice(0, 2);
                if (top.length) {
                  await say("wiki",
                    `📚 **I think this GitHub Wiki documentation might fix your problem:**\n\n` +
                    top.map((p) =>
                      `* [${p.base.replace(/-/g, " ")}](https://github.com/${owner}/${repo}/wiki/${encodeURIComponent(p.base)})` +
                      ` _(matched: ${p.matched.join(", ")})_`).join("\n") +
                    `\n\nThis is an automatic keyword match, so it may not be exact. If it doesn't help, just reply here and the developer will take a look. 🚀`);
                }
              }
            } catch (e) {
              core.warning(`Wiki discovery skipped: ${e.message}`);
            }

            // ==========================================
            // 🔍 POSSIBLE DUPLICATES (only suggests, never closes)
            // ==========================================
            { // runs once, when the version reply moves the issue to the developer's queue
              try {
                const stop = new Set(["the","and","for","with","not","app","netshield","issue","bug","when","after","but","this","that","does","doesn't","cannot","can't","working","error"]);
                const words = issue.title.toLowerCase().replace(/[^a-z0-9\s]/g, " ")
                  .split(/\s+/).filter((w) => w.length > 3 && !stop.has(w)).slice(0, 6);
                if (words.length >= 2) {
                  const q = `repo:${owner}/${repo} is:issue is:open in:title ${words.join(" ")}`;
                  const { data } = await github.rest.search.issuesAndPullRequests({ q, per_page: 5 });
                  const related = data.items.filter((i) => i.number !== issueNumber).slice(0, 3);
                  if (related.length) {
                    await addLabel("duplicate-suspected").catch(() => {});
                    await say("related",
                      `🔍 **Possibly related open issues:**\n\n` +
                      related.map((i) => `* #${i.number}: ${safe(i.title, 100)}`).join("\n") +
                      `\n\nIf one of these matches your problem, please add your details there. A maintainer will confirm whether this is a duplicate.`);
                  }
                }
              } catch (e) {
                core.warning(`Duplicate search skipped: ${e.message}`);
              }
            }

  stale-sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Close stale on-hold issues
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "on-hold", per_page: 100,
            });

            for (const i of issues) {
              if (i.pull_request) continue;
              if (new Date(i.updated_at).getTime() > cutoff) continue;

              await github.rest.issues.createComment({
                owner, repo, issue_number: i.number,
                body: `⏳ **Closing due to inactivity.** This issue stayed **On Hold** for 7 days without the required information.\n\n` +
                      `Feel free to open a new issue with the complete details. 🤖`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: i.number, state: "closed", state_reason: "not_planned",
              });
            }
