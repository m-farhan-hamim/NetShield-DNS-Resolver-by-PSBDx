name: Issue Filter & Smart Assistant

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  release:
    types: [published]
  schedule:
    - cron: "0 3 * * *"      # daily stale sweep (on-hold issues)
    - cron: "*/15 * * * *"   # every 15 min — countdown checker

concurrency:
  group: issue-assistant-${{ github.event.issue.number || github.event.release.tag_name || 'sweep' }}-${{ github.event.sender.type == 'Bot' && 'bot' || 'user' }}
  cancel-in-progress: false

permissions: {}

jobs:
  filter-and-answer:
    if: >-
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && github.event.sender.type != 'Bot' && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Fetch wiki (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki 2>/dev/null \
            || echo "::notice::No wiki found yet. Create a first wiki page to enable documentation suggestions."

      - name: Process issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const issueNumber = issue.number;
            const body = issue.body || "";
            const action = context.payload.action;

            // ---------- Guards ----------
            if (issue.pull_request) return;
            if (context.payload.sender?.type === "Bot") return;
            if (issue.state === "closed") return;
            const SKIP_MAINTAINERS = false;
            const isMaintainer = ["OWNER", "MEMBER", "COLLABORATOR"].includes(issue.author_association);
            if (SKIP_MAINTAINERS && isMaintainer) {
              core.info("Author is a maintainer; skipping automation.");
              return;
            }

            const isComment = context.eventName === "issue_comment";
            const REPORTER = issue.user.login;
            const issueLabels = (issue.labels || []).map((l) => (typeof l === "string" ? l : l.name));
            if (isComment) {
              if (context.payload.comment.user.login !== REPORTER) return;
              if (!issueLabels.includes("on-hold")) return;
            } else if (action === "edited" && issueLabels.includes("handed-over-to-developer")) {
              return;
            }

            // ---------- Helpers ----------
            const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

            function field(header) {
              const re = new RegExp(`### ${esc(header)}\\s*\\n\\s*([\\s\\S]*?)(?=\\n### |$)`, "i");
              const m = body.match(re);
              const v = m ? m[1].trim() : "";
              return /^_?no response_?$/i.test(v) ? "" : v;
            }
            function anyField(headers) {
              for (const h of headers) {
                const v = field(h);
                if (v) return v;
              }
              return "";
            }

            const safe = (s, max = 80) =>
              s.replace(/[`\r\n]/g, " ").replace(/@/g, "@\u200b").trim().slice(0, max);

            const MARK = (key) => `<!-- netshield-bot:${key} -->`;
            const MANAGED = {
              "on-hold": { color: "fbca04", description: "Waiting for required info from the reporter" },
              "handed-over-to-developer": { color: "0e8a16", description: "Validated and queued for the developer" },
              "invalid-source": { color: "b60205", description: "Reported from an unofficial download source" },
              "duplicate-suspected": { color: "cfd3d7", description: "Bot found possibly related issues" },
              "auto-close-pending": { color: "d4c5f9", description: "Bot is counting down to auto-close this issue" },
            };

            async function ensureLabel(name) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ owner, repo, name, ...MANAGED[name] });
              }
            }

            const DEVELOPER = "m-farhan-hamim";
            const MIN_SUPPORTED = [3, 0, 0];
            const VERSION_MODE = "label";

            const STATUS = ["on-hold", "handed-over-to-developer"];
            async function setStatus(target) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              const current = data.labels.map((l) => (typeof l === "string" ? l : l.name));
              const next = current.filter((l) => !STATUS.includes(l));
              if (target) { await ensureLabel(target); next.push(target); }
              if (!(next.length === current.length && next.every((l) => current.includes(l)))) {
                await github.rest.issues.setLabels({ owner, repo, issue_number: issueNumber, labels: next });
              }

              const assigned = (data.assignees || []).some((a) => a.login === DEVELOPER);
              try {
                if (target === "handed-over-to-developer" && !assigned) {
                  await github.rest.issues.addAssignees({ owner, repo, issue_number: issueNumber, assignees: [DEVELOPER] });
                } else if (target === "on-hold" && assigned) {
                  await github.rest.issues.removeAssignees({ owner, repo, issue_number: issueNumber, assignees: [DEVELOPER] });
                }
              } catch (e) {
                core.warning(`Assignee update failed: ${e.message}`);
              }
            }

            async function trackVersion(ver, tag = `v${ver}`) {
              const title = `v${ver}`;
              if (VERSION_MODE === "label") {
                const label = `affects-${tag}`;
                try { await github.rest.issues.getLabel({ owner, repo, name: label }); }
                catch (e) {
                  if (e.status !== 404) throw e;
                  await github.rest.issues.createLabel({ owner, repo, name: label, color: "c5def5", description: `Reported on ${tag}` });
                }
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                const names = data.labels.map((l) => (typeof l === "string" ? l : l.name));
                const next = names.filter((n) => !n.startsWith("affects-")).concat(label);
                await github.rest.issues.setLabels({ owner, repo, issue_number: issueNumber, labels: next });
                return;
              }
              if (issue.milestone) return;
              const all = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: "all", per_page: 100 });
              let m = all.find((x) => x.title.replace(/^v/i, "") === ver);
              if (!m) {
                m = (await github.rest.issues.createMilestone({
                  owner, repo, title, description: `Bug reports filed against ${title}`,
                })).data;
              }
              await github.rest.issues.update({ owner, repo, issue_number: issueNumber, milestone: m.number });
            }

            async function addLabel(name) {
              await ensureLabel(name);
              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [name] });
            }

            async function findComment(key) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issueNumber, per_page: 100,
              });
              return comments.find((c) => c.user?.type === "Bot" && c.body?.includes(MARK(key)));
            }
            async function say(key, text) {
              const full = `${MARK(key)}\n${text}`;
              const existing = await findComment(key);
              if (existing) {
                if (existing.body === full) return;
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: full });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: full });
              }
            }
            async function sayOnce(key, text) {
              if (await findComment(key)) return;
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: `${MARK(key)}\n${text}` });
            }
            async function closeWith(key, text) {
              await say(key, text + `\n\n*This issue has been automatically closed.* 🤖`);
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber, state: "closed", state_reason: "not_planned",
              });
            }

            // ==========================================
            // 💖 DONATION / SPONSOR ISSUES
            // ==========================================
            const donationPlatform = field("Which platform did you choose?");

            if (donationPlatform) {
              if (donationPlatform.includes("https://superchat.bd")) {
                await setStatus("handed-over-to-developer");
                await say("donation", pick([
                  `💖 **Thank you for your past support via superchat.bd!** 🙏\n\n` +
                  `We want to be upfront: **we've discontinued donation support through superchat.bd**. ` +
                  `It is no longer an active channel for NetShield, and we're no longer able to track or process contributions made there.\n\n` +
                  `⚠️ **Important:** donations made via **superchat.bd** will **not** have your name prominently displayed in our supporters list — that recognition is reserved for our official portal.\n\n` +
                  `🚀 **New official donation portal:** please use **https://donate.psbdx.com** for any future contributions. ` +
                  `Your support is what keeps NetShield alive — thank you for being part of it! 💖`,

                  `💖 **We really appreciate the intent to support us!** 🙏\n\n` +
                  `Just so you know — **superchat.bd is no longer a supported donation channel** for NetShield. ` +
                  `We've moved to our own portal and no longer process or track contributions from superchat.bd.\n\n` +
                  `⚠️ **Heads-up:** if you donated via **superchat.bd**, your name **will not be prominently displayed** in our supporters list, because we can no longer verify those contributions.\n\n` +
                  `✅ **Please use our new official portal:** **https://donate.psbdx.com** — that's where all future support and recognition happens. Thank you! 💖`,

                  `💖 **Thanks for wanting to support NetShield!** 🙏\n\n` +
                  `A quick update: **we've retired the superchat.bd donation option**. It's no longer linked to us, and we can't verify or acknowledge donations made there.\n\n` +
                  `⚠️ **Note:** if you've used **superchat.bd** in the past, your name will **not** be featured in our supporters list going forward.\n\n` +
                  `🚀 **The one to use now:** **https://donate.psbdx.com**. All active support, updates, and public recognition come from there. Thank you for backing the project! 💖`,

                  `💖 **Really appreciate the thought, but there's been a change!** 🙏\n\n` +
                  `We've **officially retired superchat.bd** as a donation channel — it's no longer connected to us in any way.\n\n` +
                  `⚠️ **Fair warning:** any donation made via **superchat.bd** will **not** show your name prominently in our supporter credits, since we have no way to confirm it on our side.\n\n` +
                  `✅ **Head over to https://donate.psbdx.com** — that's our one and only active portal now. Every future contribution, thank-you, and public shout-out happens there. Thanks for supporting NetShield! 💖`,

                  `💖 **Big thanks for the intent to back NetShield!** 🙌\n\n` +
                  `Quick heads-up: we've **discontinued donations through superchat.bd**. That channel is closed, and we can no longer verify or credit donations made there.\n\n` +
                  `⚠️ **What this means for you:** if you ever donated via **superchat.bd**, your name **will not be displayed prominently** in our supporters list — we simply can't match those payments anymore.\n\n` +
                  `🚀 **Use our new home for donations:** **https://donate.psbdx.com**. Everything (support, perks, recognition) now flows through there. Thank you! 💖`,
                ]));
                return;
              }

              if (donationPlatform.includes("https://donate.psbdx.com")) {
                await setStatus("handed-over-to-developer");

                const txId = anyField([
                  "Transaction ID", "Transaction Reference", "Transaction Hash",
                  "Payment Reference", "Reference ID", "Payment ID",
                ]);
                const amount = anyField([
                  "Donation Amount", "Amount", "How much did you donate?",
                  "Amount Donated",
                ]);
                const contextText = (
                  anyField([
                    "Describe the issue", "Describe your issue", "What happened?",
                    "Additional Details", "Anything else?", "Details", "Message",
                    "Describe the problem",
                  ]) || body
                ).toLowerCase();

                const safeTx = txId ? `\`${safe(txId, 40)}\`` : "";
                const safeAmt = amount ? `**${safe(amount, 24)}**` : "";
                const tag = `**\`handed-over-to-developer\`**`;

                const header = pick([
                  `💖 **Thank you for supporting NetShield!** 🚀\n\n`,
                  `💖 **Your support means the world to us — thank you!** 🙌\n\n`,
                  `💖 **Huge thanks for backing NetShield!** 🚀\n\n`,
                  `💖 **Really appreciate the generosity — thank you!** 🙏\n\n`,
                  `💖 **So kind of you to support the project!** 🌟\n\n`,
                ]);
                const ack = pick([
                  `We truly appreciate your generosity — it directly fuels continued development. 🙏\n\n`,
                  `Contributions like yours are what keep this project alive and improving. 🙏\n\n`,
                  `Your support genuinely helps us ship better releases. Thank you! 🙏\n\n`,
                  `It's supporters like you who let us keep NetShield free and improving. 🌟\n\n`,
                  `We don't take this for granted — your backing means a lot. 💖\n\n`,
                ]);

                const contexts = [
                  {
                    match: /(refund|money back|charged twice|double[- ]?(charged|charge|payment)|duplicate (payment|charge)|reversed|overcharged|extra charge)/,
                    reply: () => pick([
                      `${header}${ack}It sounds like you're asking about a **refund or possible duplicate charge**. 🧾\n\n` +
                      `I've tagged this ${tag} and assigned **@${DEVELOPER}**, who personally handles payment issues with our provider.\n\n` +
                      (safeTx ? `**Transaction:** ${safeTx}\n\n` : "") +
                      (safeAmt ? `**Amount:** ${safeAmt}\n\n` : "") +
                      `We'll verify against the payment logs and reply here. Approved refunds typically land back on your card within **3–7 business days**. 💳`,

                      `${header}${ack}Sorry you ran into a **double charge / refund concern** — let's get it sorted. 🙏\n\n` +
                      `I've escalated this to **@${DEVELOPER}** with the ${tag} label.\n\n` +
                      (safeTx ? `**Reference:** ${safeTx}\n\n` : "") +
                      `Please keep an eye on this thread — once we've confirmed with the payment provider, we'll let you know right here. Thanks for your patience! 💳`,

                      `${header}${ack}Understood — you're reporting a **payment that may need reversing or refunding**. ✅\n\n` +
                      `I've looped in **@${DEVELOPER}** (${tag}) so they can check the transaction on our end.\n\n` +
                      (safeTx ? `**Transaction:** ${safeTx}\n\n` : "") +
                      `We'll come back here with a clear answer, usually within 24–48 hours. Refund settlement itself can take 3–7 business days depending on your bank. 🙏`,

                      `${header}${ack}Thanks for flagging a possible **refund / double-charge** situation. 💳\n\n` +
                      `I've assigned **@${DEVELOPER}** (${tag}) to investigate and reconcile with the payment gateway.\n\n` +
                      (safeTx ? `**Reference:** ${safeTx}\n\n` : "") +
                      (safeAmt ? `**Amount in question:** ${safeAmt}\n\n` : "") +
                      `Once verified, approved refunds typically settle in 3–7 business days. We'll confirm here. 🙏`,

                      `${header}${ack}Got it — a **refund or duplicate payment** query. Let's untangle it together. 🧾\n\n` +
                      `Tagged ${tag} and handed to **@${DEVELOPER}** who handles all payment-side verification.\n\n` +
                      (safeTx ? `**Transaction:** ${safeTx}\n\n` : "") +
                      `You'll hear back here shortly — usually within a day or two. Appreciate your patience! 💖`,
                    ]),
                  },
                  {
                    match: /(fail|declin|unsuccessful|rejected|didn'?t (go through|work|process)|not (processed|completed|successful)|error|transaction (couldn'?t|could not|didn'?t)|payment (failed|declined))/,
                    reply: () => pick([
                      `${header}${ack}It sounds like your **donation didn't go through**. No worries — **failed transactions are not charged**, so you shouldn't be out anything. 💳\n\n` +
                      `I've tagged this ${tag} and assigned **@${DEVELOPER}** to check the payment gateway logs.\n\n` +
                      (safeTx ? `**Attempted reference:** ${safeTx}\n\n` : "") +
                      `In the meantime, retrying from a different browser, card, or network often helps. We'll reply here soon! 🙏`,

                      `${header}${ack}Sorry your payment ran into trouble! 🙏 **Declined or failed transactions are typically not charged.**\n\n` +
                      `I've passed this to **@${DEVELOPER}** (${tag}) so they can review what happened on the gateway side.\n\n` +
                      (safeAmt ? `**Attempted amount:** ${safeAmt}\n\n` : "") +
                      `Feel free to try again, or hang tight — we'll follow up here shortly. 🚀`,

                      `${header}${ack}That payment didn't complete — you're not alone, and it's usually harmless. 🙏\n\n` +
                      `I've flagged this ${tag} and routed it to **@${DEVELOPER}** to inspect the failed attempt.\n\n` +
                      (safeTx ? `**Reference:** ${safeTx}\n\n` : "") +
                      `We'll let you know whether anything needs retrying. Thanks for flagging it! 💖`,

                      `${header}${ack}Sorry about that — looks like the **transaction failed to process**. 💳\n\n` +
                      `Quick reassurance: **declined / failed payments don't reach us and aren't charged** on your end.\n\n` +
                      `I've tagged this ${tag} and assigned **@${DEVELOPER}** to double-check the gateway.\n\n` +
                      (safeAmt ? `**Amount attempted:** ${safeAmt}\n\n` : "") +
                      `You can safely retry, or reply here and we'll investigate further. 🙏`,

                      `${header}${ack}Hmm — sounds like the **payment was declined or errored out**. 🚫💳\n\n` +
                      `Nothing to worry about financially: unsuccessful transactions don't debit your account.\n\n` +
                      `I've looped in **@${DEVELOPER}** (${tag}) to confirm the gateway didn't record a partial charge.\n\n` +
                      (safeTx ? `**Attempted reference:** ${safeTx}\n\n` : "") +
                      `Try again whenever you're ready, or wait for our confirmation here. Thanks for your patience! 🙏`,
                    ]),
                  },
                  {
                    match: /(pending|processing|still waiting|not (yet )?(received|shown|appeared|credited|reflected|arrived)|no (confirmation|acknowledg|receipt) (yet|received)|hasn'?t (shown|appeared|arrived))/,
                    reply: () => pick([
                      `${header}${ack}Your donation may still be **pending confirmation** with the payment provider. This is normal and can take a few hours — occasionally up to 24h. ⏳\n\n` +
                      `I've tagged this ${tag} and assigned **@${DEVELOPER}** so they can verify it on our end.\n\n` +
                      (safeTx ? `**Reference:** ${safeTx}\n\n` : "") +
                      `We'll reply here as soon as we've confirmed. Thanks for your patience! 🙏`,

                      `${header}${ack}Ah, the donation hasn't shown up yet — we hear you. 🙏 Most pending transactions settle within a few hours.\n\n` +
                      `I've escalated this to **@${DEVELOPER}** (${tag}) so they can double-check the transaction record.\n\n` +
                      (safeAmt ? `**Amount:** ${safeAmt}\n\n` : "") +
                      `Sit tight — we'll update you right here. 🚀`,

                      `${header}${ack}Thanks for flagging this. If the payment is showing as **pending**, there's usually nothing to worry about yet — but we'll confirm for you. ✅\n\n` +
                      `Tagged ${tag} and handed to **@${DEVELOPER}**.\n\n` +
                      (safeTx ? `**Transaction:** ${safeTx}\n\n` : "") +
                      `We'll come back here with a clear status shortly. 🙏`,

                      `${header}${ack}Donations sometimes take a **few hours (occasionally up to 24)** to fully process and reflect. ⏳\n\n` +
                      `I've tagged this ${tag} and assigned **@${DEVELOPER}** to verify on our side.\n\n` +
                      (safeTx ? `**Reference:** ${safeTx}\n\n` : "") +
                      `We'll confirm here as soon as it clears. Thanks for your support! 💖`,

                      `${header}${ack}Got it — the donation hasn't appeared on your end yet. 🙏 Let's check it together.\n\n` +
                      `I've flagged this ${tag} for **@${DEVELOPER}** to confirm whether it's still processing or already recorded.\n\n` +
                      (safeAmt ? `**Amount:** ${safeAmt}\n\n` : "") +
                      `We'll update you here very soon. 💳`,
                    ]),
                  },
                  {
                    match: /(name|display|credit|shown|recogni|mention|acknowledg|sponsor list|hall of fame|feature me|list me|supporters)/,
                    reply: () => pick([
                      `${header}${ack}Great question about **sponsor recognition**! 🌟\n\n` +
                      `Donations made through **donate.psbdx.com** are eligible for our supporters list. ` +
                      `I've tagged this ${tag} and assigned **@${DEVELOPER}** to add or update your entry.\n\n` +
                      (safeTx ? `**Transaction:** ${safeTx}\n\n` : "") +
                      `If you'd like a different display name (or to stay anonymous), just reply here and we'll honour it. 🙏`,

                      `${header}${ack}Regarding **name display / recognition** — yes, supporters through donate.psbdx.com get credited! 🌟\n\n` +
                      `I've handed this over to **@${DEVELOPER}** (${tag}) to update the supporters list.\n\n` +
                      (safeAmt ? `**Amount noted:** ${safeAmt}\n\n` : "") +
                      `Feel free to reply with the exact name you'd like shown. Thanks again for backing us! 💖`,

                      `${header}${ack}Happy to help with the **recognition side**. 🌟\n\n` +
                      `I've tagged this ${tag} and looped in **@${DEVELOPER}** to add your name to the supporters list from our official portal.\n\n` +
                      (safeTx ? `**Reference:** ${safeTx}\n\n` : "") +
                      `We'll confirm here once it's done. Thanks for your generosity! 🙏`,

                      `${header}${ack}Nice — thanks for asking about your **supporter credit**! 🌟\n\n` +
                      `I've handed this to **@${DEVELOPER}** (${tag}) to update the supporters list.\n\n` +
                      (safeAmt ? `**Amount on file:** ${safeAmt}\n\n` : "") +
                      `Want a specific name shown (or to stay anonymous)? Just reply here and we'll match it. 💖`,

                      `${header}${ack}About the **name in our supporters list** — yes, donate.psbdx.com contributions qualify! 🌟\n\n` +
                      `Tagged ${tag} and assigned **@${DEVELOPER}** to add you.\n\n` +
                      (safeTx ? `**Transaction:** ${safeTx}\n\n` : "") +
                      `We'll confirm here shortly. Appreciate you backing NetShield! 🙏`,
                    ]),
                  },
                  {
                    match: /(screenshot|proof|receipt|verif|confirm|attached|uploaded|sent|for your records|invoice)/,
                    reply: () => pick([
                      `${header}${ack}Thanks for sending the **proof of donation**! 🧾\n\n` +
                      `I've tagged this ${tag} and assigned **@${DEVELOPER}** to verify and mark your contribution.\n\n` +
                      (safeAmt ? `**Amount noted:** ${safeAmt}\n\n` : "") +
                      (safeTx ? `**Reference:** ${safeTx}\n\n` : "") +
                      `We'll reply here once verification is complete. Really appreciate you! 🙏`,

                      `${header}${ack}Got the details — thanks for sharing the **verification info**! 🙏\n\n` +
                      `This is now with **@${DEVELOPER}** (${tag}) for review.\n\n` +
                      (safeTx ? `**Transaction:** ${safeTx}\n\n` : "") +
                      `We'll come back with confirmation shortly. 🚀`,

                      `${header}${ack}Received the receipt/invoice — thank you! 🧾\n\n` +
                      `I've passed this along to **@${DEVELOPER}** (${tag}) so they can cross-check it with our records.\n\n` +
                      `Expect a confirmation here soon. 💖`,

                      `${header}${ack}Thanks for the **supporting evidence** — that helps a lot! 🧾\n\n` +
                      `Tagged ${tag} and assigned **@${DEVELOPER}** to verify.\n\n` +
                      (safeAmt ? `**Amount:** ${safeAmt}\n\n` : "") +
                      `We'll reply here when it's confirmed. 🙏`,

                      `${header}${ack}Appreciate you attaching the **payment proof**. 📎\n\n` +
                      `I've flagged this ${tag} and handed it to **@${DEVELOPER}** for verification.\n\n` +
                      (safeTx ? `**Reference:** ${safeTx}\n\n` : "") +
                      `We'll confirm here shortly. Thank you! 💖`,
                    ]),
                  },
                  {
                    match: /^(?!.*\b(problem|issue|error|fail|refund|not work|didn'?t|can'?t|unable|help)\b).*(thank|appreciate|love (the|your|this)|great (work|project|app)|keep (it )?up|amazing|awesome|best app|fantastic|excellent)/,
                    reply: () => pick([
                      `${header}${ack}Messages like yours genuinely keep us going! 💖\n\n` +
                      `I've tagged this ${tag} so **@${DEVELOPER}** can personally acknowledge your contribution.\n\n` +
                      `Thanks again for backing NetShield — it means a lot. 🚀`,

                      `${header}${ack}That's incredibly kind — thank you! 🙏 Contributions like yours let us keep improving NetShield.\n\n` +
                      `I've looped in **@${DEVELOPER}** (${tag}) so they can say thanks properly.\n\n` +
                      `We appreciate you! 💖`,

                      `${header}${ack}This made our day. 💖 Thank you for supporting the project!\n\n` +
                      `Tagged ${tag} and handed over to **@${DEVELOPER}** for a proper thank-you.\n\n` +
                      `Your support keeps NetShield free and improving. 🚀`,

                      `${header}${ack}Really warms our hearts — thank you! 🙏\n\n` +
                      `I've passed this along to **@${DEVELOPER}** (${tag}) so they can thank you personally.\n\n` +
                      `Your kindness fuels the project. 💖`,

