name: "Bug Report"
description: "Report an issue or bug in NetShield DNS Resolver"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "### 🛡️ NetShield Bug Report System\n**App Package:** `com.netshield.dns.psbdx` *(Non-editable)*"

  - type: dropdown
    id: version-type
    attributes:
      label: "Version Type"
      description: "Select the branch / build channel you are running."
      options:
        - "Stable"
        - "Github Prerelease No type mentioned"
        - "Nightly Build"
        - "Alpha Build"
        - "Beta Build"
    validations:
      required: true

  - type: dropdown
    id: app-version
    attributes:
      label: "Stable App Version"
      description: "If you selected Stable above, choose your installed version here."
      options:
        - "N/A (I am using Prerelease / Nightly / Alpha / Beta)"
        - "3.1.2"
        - "3.1.1"
        - "3.1.0"
        - "3.0.0"
        - "2.0.0 (support closed)"
        - "1.0.0 (support closed)"
        - "BETA (support closed)"
    validations:
      required: true

  - type: input
    id: build-tag
    attributes:
      label: "Release Tag / Commit Hash (Prerelease / Test Builds Only)"
      description: "If you selected a non-stable build type above, enter the exact GitHub release tag or commit hash (e.g. v3.2.0-beta.2). Enter N/A for Stable."
      placeholder: "e.g. v3.2.0-beta.1 or N/A"
    validations:
      required: false

  - type: dropdown
    id: download-source
    attributes:
      label: "Where did you download the app from?"
      description: "Select the source platform used to obtain the APK."
      options:
        - "Github"
        - "F-droid"
        - "APK Pure"
        - "Play Store"
        - "Other 3rd party platforms"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: "Android Version / API Level"
      placeholder: "e.g. Android 14 (API 34)"
    validations:
      required: true

  - type: input
    id: device-brand
    attributes:
      label: "Device Brand & Model"
      placeholder: "e.g. realme RMX3933 / Xiaomi Poco F3"
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: "Bug Description"
      placeholder: "Describe what went wrong and steps to reproduce the issue..."
    validations:
      required: true

  - type: textarea
    id: app-log
    attributes:
      label: "Diagnostic Log (Copied from App)"
      description: "Copy and paste the diagnostic log directly from NetShield."
      placeholder: "NetShield 3.1.1 | Android 16 (API 36) | realme RMX3933\nUpstream mode: DOT\n\n[DoT (dns.adguard-dns.com:853)]\njava.net.UnknownHostException: Unable to resolve host \"dns.adguard-dns.com\": No address associated with hostname"
      render: shell
    validations:
      required: true
